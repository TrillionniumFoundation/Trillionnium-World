[workspace]
members = [
  "crates/trnm-economy-protocol",
  "crates/trnm-rpg-core",
  "crates/trnm-campaign-core",
  "crates/trnm-rts-protocol",
  "crates/trnm-rts-sim",
  "crates/trnm-online-protocol",
  "crates/trnm-game-server",
  "crates/trnm-first-contact",
]
exclude = [
  "crates/platform",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-Trillionnium-Internal"
authors = ["Trillionnium Contributors"]
publish = false

[workspace.metadata.trnm]
lane = "game-product"
canonical_binary = "trnm-first-contact"
canonical_map = "../assets/first_contact/maps/first_contact.yaml"
platform_workspace = "crates/platform/Cargo.toml"

[patch.crates-io]
# wayland-scanner 0.31.10 is the current upstream release but constrains
# quick-xml to the vulnerable 0.39 line. This local compatibility patch widens
# that build-time dependency and adapts the one changed parser API until
# upstream publishes a release.
wayland-scanner = { path = "vendor/wayland-scanner" }
