[workspace]
members = [
  "crates/trnm-world-domain",
  "crates/trnm-campaign-core",
  "crates/trnm-rts-core",
  "crates/trnm-rts-sim",
  "crates/trnm-first-contact",
]
exclude = [
  "crates/platform",
  "crates/legacy-game",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-Trillionnium-Internal"
authors = ["Trillionnium Contributors"]

[workspace.metadata.trnm]
lane = "game-product"
canonical_binary = "trnm-first-contact"
canonical_map = "../assets/first_contact/maps/first_contact.yaml"
platform_workspace = "crates/platform/Cargo.toml"
legacy_game_workspace = "crates/legacy-game/Cargo.toml"
