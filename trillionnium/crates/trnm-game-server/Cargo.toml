[package]
name = "trnm-game-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
trnm-campaign-core = { path = "../trnm-campaign-core" }
trnm-economy-protocol = { path = "../trnm-economy-protocol" }
trnm-online-protocol = { path = "../trnm-online-protocol" }
trnm-rts-protocol = { path = "../trnm-rts-protocol" }
trnm-rts-sim = { path = "../trnm-rts-sim" }
