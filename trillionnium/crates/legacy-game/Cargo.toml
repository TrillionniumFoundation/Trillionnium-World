[workspace]
members = [
  "trnm-world-domain",
  "trnm-rts-core",
  "trnm-world-command",
  "trnm-rts-data",
  "trnm-rts-bevy-runtime",
  "trnm-rts-evidence",
  "trnm-rts-online",
  "trnm-world-projection",
  "trnm-world-map-provider",
  "trnm-world-ui-fragments",
  "trnm-world-api",
  "trnm-world-server",
  "trnm-world-bevy",
  "trnm-world-dev-env",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-Trillionnium-Internal"
authors = ["Trillionnium Contributors"]

[workspace.metadata.trnm]
lane = "legacy-game-frozen"
canonical_game_workspace = "../../Cargo.toml"
