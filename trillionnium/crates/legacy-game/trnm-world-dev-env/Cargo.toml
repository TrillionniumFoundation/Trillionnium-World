[package]
name = "trnm-world-dev-env"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Trillionnium-Internal"
authors = ["Trillionnium Contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trnm-world-domain = { path = "../trnm-world-domain" }
trnm-world-map-provider = { path = "../trnm-world-map-provider" }
trnm-world-projection = { path = "../trnm-world-projection" }
trnm-world-server = { path = "../trnm-world-server" }
trnm-world-bevy = { path = "../trnm-world-bevy", features = ["legacy"] }
