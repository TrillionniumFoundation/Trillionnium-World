[package]
name = "trnm-world-bevy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bevy = { version = "0.19.0-rc.1", default-features = false, features = [
  "default_app",
  "bevy_log",
  "bevy_state",
  "bevy_window",
  "bevy_winit",
  "bevy_input_focus",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "default_font",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_render",
  "bevy_core_pipeline",
  "png",
  "x11",
  "wayland",
  "android-native-activity",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trnm-world-api = { path = "../trnm-world-api" }
trnm-world-command = { path = "../trnm-world-command" }
trnm-world-domain = { path = "../trnm-world-domain" }
trnm-world-map-provider = { path = "../trnm-world-map-provider" }
trnm-world-projection = { path = "../trnm-world-projection" }
trnm-rts-bevy-runtime = { path = "../trnm-rts-bevy-runtime" }
trnm-rts-core = { path = "../trnm-rts-core" }
trnm-rts-data = { path = "../trnm-rts-data" }

[target.'cfg(not(target_os = "android"))'.dependencies]
minifb = "0.27"
