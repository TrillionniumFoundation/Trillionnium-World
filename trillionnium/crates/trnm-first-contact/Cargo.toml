[package]
name = "trnm-first-contact"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bevy = { version = "=0.19.0-rc.1", default-features = false, features = [
  "default_app",
  "bevy_log",
  "bevy_window",
  "bevy_winit",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "default_font",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_render",
  "bevy_core_pipeline",
  "png",
  "x11",
  "wayland",
] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
trnm-campaign-core = { path = "../trnm-campaign-core" }
trnm-rts-protocol = { path = "../trnm-rts-protocol" }
trnm-rts-sim = { path = "../trnm-rts-sim" }
