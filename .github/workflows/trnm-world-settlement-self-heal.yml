name: trnm-world-settlement-self-heal

on:
  workflow_dispatch:
  push:
    branches:
      - fix/world-settlement-gap-closure-v1

permissions:
  contents: write

concurrency:
  group: trnm-world-settlement-self-heal-fix-world-settlement-gap-closure-v1
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: '1'

jobs:
  validate-format-and-commit:
    if: github.actor != 'github-actions[bot]'
    name: trnm-world-settlement-self-heal/exact-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact closeout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/world-settlement-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify branch and reviewed stack base
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/world-settlement-gap-closure-v1'
          git merge-base --is-ancestor ee881a0fec0f40091eaeba67c667ea82ff9d440a HEAD

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply deterministic formatting only
        working-directory: trillionnium
        run: cargo fmt --all

      - name: Enforce source and status contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check-trnm-settlement-runtime-status.py \
            scripts/test-trnm-settlement-runtime-status-negative.py \
            scripts/check-world-main-governance.py
          python3 scripts/check-trnm-settlement-runtime-status.py
          python3 scripts/test-trnm-settlement-runtime-status-negative.py
          python3 scripts/check-world-main-governance.py
          bash -n scripts/check-trnm-settlement-transaction-boundary.sh
          bash -n scripts/check_trnm_settlement_transaction_boundary.sh
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh

      - name: Run World settlement unit and ownership contracts
        working-directory: trillionnium
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test -p trnm-game-server --lib --locked
          cargo test -p trnm-game-server --bin trnm-entitlement-signer --locked
          cargo test -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo test -p trnm-game-server --test settlement_remote_identity_contract --locked
          cargo test -p trnm-game-server --test settlement_worker_contract --locked
          cargo test -p trnm-game-server --test settlement_fault_model --locked

      - name: Run mandatory PostgreSQL settlement contracts
        working-directory: trillionnium
        run: |
          set -euo pipefail
          cargo test -p trnm-game-server --test settlement_capture_commit_boundary --locked
          cargo test -p trnm-game-server --test settlement_database_contract --locked
          cargo test -p trnm-game-server --test settlement_serialization_database --locked
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked

      - name: Strict all-target lint
        working-directory: trillionnium
        run: cargo clippy -p trnm-game-server --all-targets --locked -- -D warnings

      - name: Commit only deterministic rustfmt changes
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if test -z "$changed"; then
            echo 'Exact branch is already rustfmt-clean.'
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '^trillionnium/crates/trnm-game-server/.+\.rs$' >/dev/null; then
            echo 'Refusing to commit a non-Rust or out-of-scope change:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git add trillionnium/crates/trnm-game-server
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(settlement): apply pinned rustfmt after exact gates'
          git push origin HEAD:fix/world-settlement-gap-closure-v1
