name: trnm-world-source-foundations

on:
  push:
    branches:
      - fix/world-plan-v4-convergence-2026-08-30
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-source-foundations-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  source-foundations:
    name: source-foundations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'head=%s\ntree=%s\n' "${GITHUB_SHA}" "$(git rev-parse HEAD^{tree})"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate source foundations
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-trnm-world-source-foundations.sh
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --all-targets

      - name: Prove read-only validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
