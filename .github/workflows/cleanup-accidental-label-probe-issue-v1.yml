name: cleanup-accidental-label-probe-issue-v1

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  issues: write
  contents: read

jobs:
  cleanup:
    name: cleanup/accidental-label-probe-issue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Close only the exact accidental probe title
        shell: bash
        env:
          GH_ISSUES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_ISSUES_TOKEN']
          exact_title = 'placeholder label schema probe'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          query = urllib.parse.urlencode({
              'state': 'open',
              'creator': 'ProfHepta',
              'per_page': 100,
          })
          url = f'https://api.github.com/repos/{repo}/issues?{query}'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              issues = json.load(response)
          closed = []
          for issue in issues:
              if 'pull_request' in issue or issue.get('title') != exact_title:
                  continue
              number = int(issue['number'])
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{number}',
                  data=b'{"state":"closed","state_reason":"not_planned"}',
                  method='PATCH',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60):
                  pass
              closed.append(number)
          print(json.dumps({
              'schema': 'world.accidental-probe-cleanup.v1',
              'exact_title': exact_title,
              'closed_issue_numbers': closed,
              'production_authorization': 'not_granted',
          }, sort_keys=True))
          PY
