name: trnm-world-rules-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/contracts/trnm-world-rules-contract-v1/**'
      - 'tools/generate-trnm-world-boundary.py'
      - 'tools/trnm-world-shadow-diff/**'
      - 'integration/component-locks/trnm-world-rules-v1.lock.json'
      - 'docs/development/trnm-world-rules-contract-v1.md'
      - 'docs/runbooks/trnm-world-nakama-authority-cutover-v1.md'
      - 'scripts/check-trnm-world-rules-contract.sh'
      - 'scripts/test-trnm-world-rules-contract-negative.sh'
      - '.github/workflows/trnm-world-rules-contract.yml'
  push:
    branches:
      - main
      - feature/world-deterministic-transition-contract-v1
      - feature/world-transition-https-fixture-v1
    paths:
      - 'trillionnium/contracts/trnm-world-rules-contract-v1/**'
      - 'tools/generate-trnm-world-boundary.py'
      - 'tools/trnm-world-shadow-diff/**'
      - 'integration/component-locks/trnm-world-rules-v1.lock.json'
      - 'docs/development/trnm-world-rules-contract-v1.md'
      - 'docs/runbooks/trnm-world-nakama-authority-cutover-v1.md'
      - 'scripts/check-trnm-world-rules-contract.sh'
      - 'scripts/test-trnm-world-rules-contract-negative.sh'
      - '.github/workflows/trnm-world-rules-contract.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-rules-contract-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Verify generated cross-runtime authority boundary
        run: python3 tools/generate-trnm-world-boundary.py --check
      - name: Validate contract schemas, vectors, lock and shadow runner
        run: bash scripts/check-trnm-world-rules-contract.sh
      - name: Prove authority and divergence violations fail closed
        run: bash scripts/test-trnm-world-rules-contract-negative.sh
      - name: Compile Python reference tools
        run: >-
          python3 -m py_compile
          tools/generate-trnm-world-boundary.py
          tools/trnm-world-shadow-diff/reference_contract.py
          tools/trnm-world-shadow-diff/trnm_world_shadow_diff.py
          tools/trnm-world-shadow-diff/test_reference_contract.py
          tools/trnm-world-shadow-diff/test_shadow_diff.py

  rust-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: trillionnium/contracts/trnm-world-rules-contract-v1
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        working-directory: ${{ github.workspace }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Install exact stable Rust action revision
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test deterministic reference contract
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Emit canonical vector
        run: cargo run --locked --bin trnm-world-rules-vector -- all
