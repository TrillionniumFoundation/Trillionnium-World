name: tmp-world-admin-event-probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-World' &&
      github.event.issue.number == 39 &&
      github.event.comment.body == '/world-admin-event-probe-20260830' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record bounded execution identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "event=${GITHUB_EVENT_NAME}" \
            "actor=${GITHUB_ACTOR}" \
            "sha=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}"
