name: tmp-world-v4-direct-source-publisher-20260906-a

on:
  push:
    branches:
      - ops/world-v4-direct-source-publisher-20260906-a
    paths:
      - .github/workflows/tmp-world-v4-direct-source-publisher-20260906-a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-world-v4-direct-source-publisher-20260906-a
  cancel-in-progress: false

env:
  SOURCE_WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
  CONTROL_HEAD: "68e9631b3fc3f75f332497f8d0551608bf0e1413"
  EXPECTED_PATCH_SHA256: "ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f"
  EXPECTED_QUALIFIED_TREE: "5e613185f5a2abda42df371f3755e73667717309"
  TARGET_BRANCH: "fix/world-plan-v4-development-closure-20260831"
  EXPECTED_TARGET_HEAD: "021ce069e08a528f2d89cc6990b7c1a5b1aa4a08"
  OPS_BRANCH: "ops/world-v4-direct-source-publisher-20260906-a"
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  qualify-test-and-fast-forward:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-World' && github.ref_name == 'ops/world-v4-direct-source-publisher-20260906-a'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Reproduce immutable qualified source
        shell: bash
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init qualified
          git -C qualified remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C qualified fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C qualified checkout --detach FETCH_HEAD
          test "$(git -C qualified rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          mkdir -p export
          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/qualified" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          patch_sha="$(sha256sum export/world-v13-source.patch | awk '{print $1}')"
          test "${patch_sha}" = "${EXPECTED_PATCH_SHA256}"
          git -C qualified add -A
          qualified_tree="$(git -C qualified write-tree)"
          test "${qualified_tree}" = "${EXPECTED_QUALIFIED_TREE}"
          test ! -e qualified/trillionnium/crates/trnm-game-server/build.rs
          test ! -e qualified/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' qualified/trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' qualified/trillionnium/crates/trnm-game-server

          git -C qualified diff --cached --binary --full-index "${SOURCE_WORLD_HEAD}" -- > export/qualified-source.diff
          git -C qualified diff --cached --name-only "${SOURCE_WORLD_HEAD}" -- | LC_ALL=C sort -u > export/allowed-paths.txt
          test -s export/qualified-source.diff
          test -s export/allowed-paths.txt
          printf 'TRNM_WORLD_REPRODUCED_TREE=%s\n' "${qualified_tree}"
          printf 'TRNM_WORLD_REPRODUCTION=PASS\n'

      - name: Check out exact live candidate and binding preflight
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --branch "${TARGET_BRANCH}" \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git \
            trillionnium-world
          test "$(git -C trillionnium-world rev-parse HEAD)" = "${EXPECTED_TARGET_HEAD}"
          test -z "$(git -C trillionnium-world status --porcelain)"
          git -C trillionnium-world fetch --no-tags origin "${SOURCE_WORLD_HEAD}"
          git -C trillionnium-world merge-base --is-ancestor "${SOURCE_WORLD_HEAD}" "${EXPECTED_TARGET_HEAD}"
          cd trillionnium-world
          bash scripts/project-preflight.sh --dev

      - name: Three-way replay exact qualified delta without losing successors
        shell: bash
        run: |
          set -euo pipefail
          cd trillionnium-world
          test "$(git rev-parse HEAD)" = "${EXPECTED_TARGET_HEAD}"
          test -z "$(git status --porcelain)"

          if ! git apply --3way --index "$GITHUB_WORKSPACE/export/qualified-source.diff"; then
            git apply --3way --index --reverse "$GITHUB_WORKSPACE/export/qualified-source.diff" >/dev/null 2>&1 && {
              echo 'qualified delta is already fully present; refusing trigger-only commit' >&2
              exit 40
            }
            echo 'exact qualified three-way replay conflicted or drifted' >&2
            exit 41
          fi

          git diff --cached --name-only | LC_ALL=C sort -u > "$RUNNER_TEMP/actual-paths.txt"
          test -s "$RUNNER_TEMP/actual-paths.txt"
          comm -23 "$RUNNER_TEMP/actual-paths.txt" "$GITHUB_WORKSPACE/export/allowed-paths.txt" > "$RUNNER_TEMP/unexpected-paths.txt"
          test ! -s "$RUNNER_TEMP/unexpected-paths.txt"

          test ! -e trillionnium/crates/trnm-game-server/build.rs
          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -q '^build = "build.rs"$' trillionnium/crates/trnm-game-server/Cargo.toml
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'reconcile_economy(&state.cex' trillionnium/crates/trnm-game-server/src
          ! grep -R --line-number --fixed-strings 'settle_pending_matches(&settlement_state' trillionnium/crates/trnm-game-server/src
          grep -R --line-number --fixed-strings 'terminal settlement is owned by trnm-settlement-worker' trillionnium/crates/trnm-game-server/src
          grep -q '^reqwest = ' trillionnium/crates/trnm-game-server/Cargo.toml
          grep -R --line-number --fixed-strings 'lock_terminal_rows' trillionnium/crates/trnm-game-server/src
          grep -R --line-number --fixed-strings '0019_online_settlement_quarantine_v1' trillionnium/crates/trnm-game-server

          git diff --cached --check
          bash scripts/project-preflight.sh --staged

      - name: Compile and test directly tracked bytes
        shell: bash
        working-directory: trillionnium-world
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml -p trnm-game-server
          git add -A
          git diff --cached --check
          bash scripts/project-preflight.sh --staged

          cargo check --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --lib
          cargo test --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --lib
          cargo clippy --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --lib -- -D warnings
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh
          if test -f scripts/check-trnm-settlement-lock-order.py; then
            python3 scripts/check-trnm-settlement-lock-order.py
          fi
          if test -f scripts/test-trnm-settlement-lock-order.py; then
            python3 scripts/test-trnm-settlement-lock-order.py
          fi

          test ! -e trillionnium/crates/trnm-game-server/build.rs
          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -q '^build = "build.rs"$' trillionnium/crates/trnm-game-server/Cargo.toml
          git diff --cached --check
          printf 'TRNM_WORLD_DIRECT_SOURCE_TESTS=PASS\n'

      - name: Commit and fast-forward only the unchanged target head
        shell: bash
        working-directory: trillionnium-world
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${observed}" = "${EXPECTED_TARGET_HEAD}"
          test -n "$(git diff --cached --name-only)"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(world): publish reviewed game-server direct source" \
            -m "Reproduce the immutable qualified Plan V4 delta through a three-way replay onto the current candidate, preserving later bounded CEX HTTP, settlement lock-order and runtime-v2 successors. Retire semantic build.rs/lib.rs.in authority and compile the directly tracked bytes." \
            -m "Source-World-Head: ${SOURCE_WORLD_HEAD}" \
            -m "Qualification-Control-Head: ${CONTROL_HEAD}" \
            -m "Qualified-Tree: ${EXPECTED_QUALIFIED_TREE}" \
            -m "Patch-SHA256: ${EXPECTED_PATCH_SHA256}" \
            -m "Production-Authorization: not_granted"

          new_head="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          observed_again="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${observed_again}" = "${EXPECTED_TARGET_HEAD}"

          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          published="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${published}" = "${new_head}"
          printf 'TRNM_WORLD_PUBLISHED_HEAD=%s\n' "${new_head}"
          printf 'TRNM_WORLD_PUBLISHED_TREE=%s\n' "${new_tree}"
          printf 'TRNM_WORLD_DIRECT_SOURCE_PUBLICATION=PASS\n'

      - name: Remove temporary control branch after successful publication
        shell: bash
        working-directory: trillionnium-world
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin --delete "${OPS_BRANCH}"
          test -z "$(git ls-remote origin "refs/heads/${OPS_BRANCH}")"
          printf 'TRNM_WORLD_TEMPORARY_CONTROL_REMOVED=PASS\n'
