name: trnm-world-rts-intake-contract

on:
  pull_request:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-rts-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake-contract:
    name: trnm-world-v4/rts-intake-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_NAME: ${{ github.event_name }}
      RUST_TOOLCHAIN: 1.98.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Install pinned validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc +"$RUST_TOOLCHAIN" --version --verbose | tee evidence/toolchain.txt
      - name: Validate exact head and prospective PR merge object
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'TrillionniumFoundation/Trillionnium-World' ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init repository
          git -C repository remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          objects=("$HEAD_SHA")
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EVENT_SHA" != "$HEAD_SHA" ]]
            objects+=("$EVENT_SHA")
          fi
          index=0
          for sha in "${objects[@]}"; do
            git -C repository fetch --no-tags --depth=3 origin "$sha"
            git -C repository checkout --detach FETCH_HEAD
            test "$(git -C repository rev-parse HEAD)" = "$sha"
            if [[ "$index" == 1 ]]; then
              test "$(git -C repository rev-parse HEAD^1)" = "$BASE_SHA"
              test "$(git -C repository rev-parse HEAD^2)" = "$HEAD_SHA"
            fi
            (
              cd repository
              printf 'TESTED_COMMIT=%s\nTESTED_TREE=%s\n' "$sha" "$(git rev-parse HEAD^{tree})"
              python3 scripts/check-trnm-rts-intake-conformance.py --self-test
              cargo +"$RUST_TOOLCHAIN" fmt --manifest-path trillionnium/crates/trnm-rts-protocol/Cargo.toml -- --check
              cargo +"$RUST_TOOLCHAIN" test --manifest-path trillionnium/Cargo.toml -p trnm-rts-protocol --all-targets --locked
              cargo +"$RUST_TOOLCHAIN" clippy --manifest-path trillionnium/Cargo.toml -p trnm-rts-protocol --all-targets --locked -- -D warnings
              git diff --exit-code
              git diff --cached --exit-code
            ) 2>&1 | tee "evidence/${sha}.log"
            index=$((index + 1))
          done
          printf 'RTS_INTAKE_OBJECTS_VALIDATED=%s\n' "$index"
          printf 'RUNTIME_ADOPTION=not_proven\nPRODUCTION_AUTHORIZATION=not_granted\n' | tee evidence/scope.txt
          sha256sum evidence/*.txt evidence/*.log > evidence/SHA256SUMS
      - name: Retain exact-object validation logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rts-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
