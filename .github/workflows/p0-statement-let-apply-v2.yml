name: p0-statement-let-apply-v2

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: p0-statement-let-apply-v2
  cancel-in-progress: false

jobs:
  verify_apply:
    name: world-p0/verify-and-apply-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: 58f76a6100bade6e148a56bd429eff34f8a255cd
      TARGET_BRANCH: refactor/campaign-module-stack-v2-20260909
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
      RUST_BACKTRACE: '1'
    steps:
      - name: Fetch exact candidate and helper source
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$candidate" "$helper"
          git init "$candidate"
          git -C "$candidate" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$EXPECTED_HEAD"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/patch-p0-statement-let.py"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=no)"

      - name: Apply exact source transformation
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"
          python3 "$RUNNER_TEMP/helper/scripts/patch-p0-statement-let.py" "$target"
          git -C "$RUNNER_TEMP/candidate" diff --check
          test "$(git -C "$RUNNER_TEMP/candidate" diff --name-only)" = \
            "trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"

      - name: Verify full P0 boundary contract
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cd "$RUNNER_TEMP/candidate"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-game-server \
            --test p0_boundary_contract \
            --locked -- --nocapture

      - name: Advance exact PR branch atomically
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_WRITE_TOKEN"]
          expected = os.environ["EXPECTED_HEAD"]
          branch = os.environ["TARGET_BRANCH"]
          path = Path(__import__("sys").argv[1])
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, suffix, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              req = urllib.request.Request(api + suffix, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          ref_suffix = "/git/ref/heads/" + urllib.parse.quote(branch, safe="/")
          current = request("GET", ref_suffix)["object"]["sha"]
          if current != expected:
              raise SystemExit(f"target branch drifted: expected {expected}, observed {current}")
          parent = request("GET", f"/git/commits/{expected}")
          blob = request("POST", "/git/blobs", {
              "content": base64.b64encode(path.read_bytes()).decode("ascii"),
              "encoding": "base64",
          })["sha"]
          tree = request("POST", "/git/trees", {
              "base_tree": parent["tree"]["sha"],
              "tree": [{
                  "path": "trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs",
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob,
              }],
          })["sha"]
          commit = request("POST", "/git/commits", {
              "message": "fix(p0): distinguish statement let from pattern bindings",
              "tree": tree,
              "parents": [expected],
          })["sha"]
          current = request("GET", ref_suffix)["object"]["sha"]
          if current != expected:
              raise SystemExit(f"target branch moved before update: {current}")
          updated = request("PATCH", "/git/refs/heads/" + urllib.parse.quote(branch, safe="/"), {
              "sha": commit,
              "force": False,
          })["object"]["sha"]
          if updated != commit:
              raise SystemExit("ref update did not bind the created commit")
          print(f"WORLD_PR_BRANCH_ADVANCED={commit}")
          print("FORCE_UPDATE=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY

      - name: Close accidental temporary-head placeholder pull requests
        if: always()
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_WRITE_TOKEN"]
          branch = os.environ["GITHUB_REF_NAME"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = f"https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(repo.split('/')[0] + ':' + branch)}&per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              pulls = json.load(response)
          for pull in pulls:
              if pull.get("title") not in {"placeholder", "placeholder-cleanup-marker"}:
                  continue
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{pull['number']}",
                  data=b'{"state":"closed"}', method="PATCH", headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60):
                  pass
              print(f"CLOSED_PLACEHOLDER_PR={pull['number']}")
          PY
