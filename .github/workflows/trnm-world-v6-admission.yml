name: trnm-world-v6-admission

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/world-*'
      - 'integration/world-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-v6-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  MERGE_SHA: ${{ github.sha }}
  POSTGRES_IMAGE_REF: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  truth-head:
    name: trnm-world-v6/docs-governance-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Run current truth qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh truth
      - name: Upload truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-truth-head-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/truth/**
          if-no-files-found: warn
          retention-days: 30

  truth-merge:
    name: trnm-world-v6/docs-governance-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout actual GitHub prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge identity and ordered parents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Run prospective-merge truth qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh truth
      - name: Upload prospective-merge truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-truth-merge-${{ env.MERGE_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/truth/**
          if-no-files-found: warn
          retention-days: 30

  source-head:
    name: trnm-world-v6/source-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned toolchain and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config
          rustc --version --verbose
          cargo --version --verbose
      - name: Run exact-head source qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh source
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-source-head-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/source/**
          if-no-files-found: warn
          retention-days: 30

  source-merge:
    name: trnm-world-v6/source-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout actual GitHub prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge identity and ordered parents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned toolchain and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Run prospective-merge source qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh source
      - name: Upload prospective-merge source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-source-merge-${{ env.MERGE_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/source/**
          if-no-files-found: warn
          retention-days: 30

  postgres-head:
    name: trnm-world-v6/postgres-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Run exact-head PostgreSQL qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh postgres
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-postgres-head-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/postgres/**
          if-no-files-found: warn
          retention-days: 30

  postgres-merge:
    name: trnm-world-v6/postgres-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    steps:
      - name: Checkout actual GitHub prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge identity and ordered parents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Run prospective-merge PostgreSQL qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh postgres
      - name: Upload prospective-merge PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-postgres-merge-${{ env.MERGE_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/postgres/**
          if-no-files-found: warn
          retention-days: 30

  package-head:
    name: trnm-world-v6/supply-chain-package-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install pinned toolchain and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Run exact-head package qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh package
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-package-head-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/**
          if-no-files-found: warn
          retention-days: 30

  package-merge:
    name: trnm-world-v6/supply-chain-package-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout actual GitHub prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge identity and ordered parents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
      - name: Install pinned toolchain and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Run prospective-merge package qualification
        shell: bash
        run: bash scripts/run-trnm-world-v6-qualification.sh package
      - name: Upload prospective-merge package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-v6-package-merge-${{ env.MERGE_SHA }}-${{ github.run_attempt }}
          path: run/world-v6/**
          if-no-files-found: warn
          retention-days: 30

  required:
    name: trnm-world-v6/required
    if: >-
      always() &&
      needs.truth-head.result == 'success' &&
      needs.source-head.result == 'success' &&
      needs.postgres-head.result == 'success' &&
      needs.package-head.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.truth-merge.result == 'success' &&
        needs.source-merge.result == 'success' &&
        needs.postgres-merge.result == 'success' &&
        needs.package-merge.result == 'success'))
    needs:
      - truth-head
      - truth-merge
      - source-head
      - source-merge
      - postgres-head
      - postgres-merge
      - package-head
      - package-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record aggregate qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          printf 'TRNM_WORLD_V6_REQUIRED=PASS\n'
          printf 'HEAD_SHA=%s\n' "$HEAD_SHA"
          printf 'MERGE_SHA=%s\n' "$MERGE_SHA"
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
