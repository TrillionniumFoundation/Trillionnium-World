name: world-rts-test-module-migration-v2

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write

concurrency:
  group: world-rts-test-module-migration-v2
  cancel-in-progress: false

jobs:
  migrate:
    name: world-ownership/rts-test-modules-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ORIGINAL_HEAD: 58f76a6100bade6e148a56bd429eff34f8a255cd
      TARGET_BRANCH: refactor/campaign-module-stack-v2-20260909
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Fetch current P0-repaired descendant and helpers
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ready=false
          for _ in $(seq 1 180); do
            current="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test -n "$current"
            rm -rf "$RUNNER_TEMP/world"
            git init -q "$RUNNER_TEMP/world"
            git -C "$RUNNER_TEMP/world" remote add origin "$remote"
            git -C "$RUNNER_TEMP/world" fetch -q --no-tags origin "$current" "$ORIGINAL_HEAD"
            git -C "$RUNNER_TEMP/world" checkout -q --detach "$current"
            git -C "$RUNNER_TEMP/world" merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
            if grep -Fq 'fn statement_let_at(bytes: &[u8], start: usize) -> bool' \
              "$RUNNER_TEMP/world/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          for helper in migrate-rts-test-includes-v1.py recalculate-rts-source-part-manifest-v2.py; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/$helper" \
              > "$RUNNER_TEMP/$helper"
            test -s "$RUNNER_TEMP/$helper"
          done
          printf 'WORLD_RTS_MIGRATION_V2_INPUT_HEAD=%s\n' "$current"

      - name: Apply exact module conversion when absent
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          part="$work/trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs"
          if grep -Fq '#[path = "rts_tests_01.rs"]' "$part"; then
            for name in rts_tests_01 rts_tests_02 rts_tests_03; do
              test "$(grep -Fc "#[path = \"${name}.rs\"]" "$part")" -eq 1
              test "$(grep -Fc "mod ${name};" "$part")" -eq 1
              ! grep -Fq "/src/lib_parts/tests/${name}.rs" "$part"
              test "$(grep -Fc 'use super::*;' "$work/trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/${name}.rs")" -eq 1
            done
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'WORLD_RTS_TEST_MODULE_MIGRATION=already_present\n'
          else
            python3 "$RUNNER_TEMP/migrate-rts-test-includes-v1.py" "$work"
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Format changed crate and synchronize existing integrity records
        if: steps.migration.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          work="$RUNNER_TEMP/world"
          cd "$work"
          cargo fmt --manifest-path trillionnium/Cargo.toml -p trnm-rts-sim
          python3 "$RUNNER_TEMP/recalculate-rts-source-part-manifest-v2.py" "$work"
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json
          trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs
          trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs
          trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs
          trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Let native boundaries and Rust compilation decide completeness
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          cd "$RUNNER_TEMP/world"
          python3 scripts/check-trnm-world-include-boundaries.py
          python3 scripts/test-trnm-world-include-boundaries.py
          python3 scripts/check-trnm-world-component-catalog.py
          python3 scripts/test-trnm-world-component-catalog.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-rts-sim --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Ordinary fast-forward only after all gates pass
        if: steps.migration.outputs.changed == 'true'
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          original="$(git -C "$work" rev-parse HEAD)"
          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$original"
          git -C "$work" config user.name 'ProfHepta'
          git -C "$work" config user.email '102159240+ProfHepta@users.noreply.github.com'
          git -C "$work" add \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs
          git -C "$work" commit -m 'refactor(rts): replace inner test includes with modules'
          new_head="$(git -C "$work" rev-parse HEAD)"
          git -C "$work" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$new_head"
          printf 'WORLD_RTS_TEST_MODULE_HEAD=%s\n' "$new_head"
          printf 'FORCE_UPDATE=false\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
