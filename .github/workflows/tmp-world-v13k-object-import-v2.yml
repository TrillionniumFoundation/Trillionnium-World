name: tmp-world-v13k-object-import-v2

on:
  push:
    branches:
      - chore/world-object-import-v13k-20260901
    paths:
      - .github/workflows/tmp-world-v13k-object-import-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-world-v13k-object-import-v2
  cancel-in-progress: true

jobs:
  import-unreferenced-qualified-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_TOOLCHAIN: "1.98.0"
      SOURCE_WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
      CONTROL_HEAD: "68e9631b3fc3f75f332497f8d0551608bf0e1413"
      EXPECTED_PATCH_SHA256: "ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f"
      EXPECTED_TREE: "5e613185f5a2abda42df371f3755e73667717309"
      REPOSITORY: "TrillionniumFoundation/Trillionnium-World"
    steps:
      - name: Reconstruct exact qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/export"
          test "$(sha256sum export/world-v13-source.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git -C candidate add -A
          test "$(git -C candidate write-tree)" = "${EXPECTED_TREE}"

      - name: Import blobs and tree without creating a commit or updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; root=pathlib.Path('candidate')
          expected=os.environ['EXPECTED_TREE']
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                  'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'trnm-world-unreferenced-tree-import-v2'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'{method} {path} failed {e.code}: {e.read().decode("utf-8","replace")}')
          base=api('GET',f'/repos/{repo}/git/commits/{os.environ["SOURCE_WORLD_HEAD"]}')['tree']['sha']
          raw=subprocess.check_output(['git','-C',str(root),'diff','--cached','--name-only','-z'])
          paths=[x.decode() for x in raw.split(b'\0') if x]
          if len(paths)<50: raise SystemExit(f'undersized candidate: {len(paths)} paths')
          entries=[]
          for rel in paths:
              p=root/rel
              if not p.exists():
                  entries.append({'path':rel,'mode':'100644','type':'blob','sha':None}); continue
              mode=subprocess.check_output(['git','-C',str(root),'ls-files','-s','--',rel],text=True).split()[0]
              data=p.read_bytes()
              blob=api('POST',f'/repos/{repo}/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':rel,'mode':mode,'type':'blob','sha':blob['sha']})
          tree=api('POST',f'/repos/{repo}/git/trees',{'base_tree':base,'tree':entries})
          if tree['sha']!=expected: raise SystemExit(f'tree mismatch: {tree["sha"]} != {expected}')
          print(f'TRNM_WORLD_UNREFERENCED_QUALIFIED_TREE={tree["sha"]}')
          print('TRNM_WORLD_NO_COMMIT_OR_REF_UPDATE=PASS')
          PY
