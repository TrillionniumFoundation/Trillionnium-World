name: p0-statement-let-fix-58f76a-20260910

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write

concurrency:
  group: p0-statement-let-fix-58f76a-20260910
  cancel-in-progress: true

jobs:
  verify_export:
    name: world-p0/verify-and-export-operator-batch
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_p0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_p0_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CANDIDATE_COMMIT: 58f76a6100bade6e148a56bd429eff34f8a255cd
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_p0_ci
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact candidate and helper
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$candidate" "$helper"
          git init "$candidate"
          git -C "$candidate" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate" fetch --no-tags --depth=1 origin "$CANDIDATE_COMMIT"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/patch-p0-statement-let.py"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=no)"

      - name: Apply exact World batch in temporary clone
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          python3 "$RUNNER_TEMP/helper/scripts/patch-p0-statement-let.py" "$candidate"
          git -C "$candidate" diff --check

      - name: Install exact Rust toolchain and format batch
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          cd "$RUNNER_TEMP/candidate"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql
          trillionnium/crates/trnm-game-server/src/lib_parts/configuration_and_migrations/part_01.rs
          trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json
          trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs
          trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

      - name: Verify direct-source manifest binding
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source_root = Path("trillionnium/crates/trnm-game-server/src")
          manifest = json.loads((source_root / "lib_parts/manifest.json").read_text())
          relative = "lib_parts/configuration_and_migrations/part_01.rs"
          matches = [item for item in manifest["parts"] if item["path"] == relative]
          assert len(matches) == 1
          data = (source_root / relative).read_bytes()
          assert matches[0]["bytes"] == len(data)
          assert matches[0]["sha256"] == hashlib.sha256(data).hexdigest()
          print("WORLD_DIRECT_SOURCE_MANIFEST_BINDING=PASS")
          PY

      - name: Run complete P0 boundary contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-game-server \
            --test p0_boundary_contract \
            --locked -- --nocapture

      - name: Run settlement operator PostgreSQL contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-game-server \
            --test settlement_operator_controls_database \
            --locked -- --nocapture

      - name: Upload immutable exact World batch blobs
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql" \
            "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/src/lib_parts/configuration_and_migrations/part_01.rs" \
            "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json" \
            "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs" \
            "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          labels = (
              "WORLD_OPERATOR_MIGRATION",
              "WORLD_CONFIGURATION_PART",
              "WORLD_DIRECT_SOURCE_MANIFEST",
              "WORLD_P0_BOUNDARY_TEST",
              "WORLD_OPERATOR_DATABASE_TEST",
          )
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_OBJECT_TOKEN"]
          for label, raw_path in zip(labels, sys.argv[1:]):
              path = Path(raw_path)
              expected = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=json.dumps({
                      "content": base64.b64encode(path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  }, separators=(",", ":")).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  observed = json.load(response).get("sha")
              assert observed == expected, (label, expected, observed)
              print(f"{label}_BLOB_SHA={observed}")
          print("WORLD_P0_OPERATOR_BATCH_IMMUTABLE_EXPORT=PASS")
          print("REFS_MOVED=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
