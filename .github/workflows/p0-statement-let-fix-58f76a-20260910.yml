name: p0-statement-let-fix-58f76a-20260910

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write

concurrency:
  group: p0-statement-let-fix-58f76a-20260910
  cancel-in-progress: false

jobs:
  verify_export:
    name: world-p0/verify-and-export-statement-let-fix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_COMMIT: 58f76a6100bade6e148a56bd429eff34f8a255cd
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Fetch exact candidate and helper
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$candidate" "$helper"
          git init "$candidate"
          git -C "$candidate" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate" fetch --no-tags --depth=1 origin "$CANDIDATE_COMMIT"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/patch-p0-statement-let.py"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=no)"

      - name: Apply exact patch in temporary clone
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          target="$candidate/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"
          python3 "$RUNNER_TEMP/helper/scripts/patch-p0-statement-let.py" "$target"
          git -C "$candidate" diff --check
          test "$(git -C "$candidate" diff --name-only)" = \
            "trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"

      - name: Run complete P0 boundary contract
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cd "$RUNNER_TEMP/candidate"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-game-server \
            --test p0_boundary_contract \
            --locked -- --nocapture

      - name: Upload immutable patched test blob without moving refs
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/candidate/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          path = Path(sys.argv[1])
          content = path.read_bytes()
          expected = subprocess.check_output(
              ["git", "hash-object", str(path)], text=True
          ).strip()
          payload = json.dumps({
              "content": base64.b64encode(content).decode("ascii"),
              "encoding": "base64",
          }, separators=(",", ":")).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_OBJECT_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          observed = result.get("sha")
          assert observed == expected, (expected, observed)
          print(f"WORLD_P0_PATCHED_BLOB_SHA={observed}")
          print("REFS_MOVED=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
