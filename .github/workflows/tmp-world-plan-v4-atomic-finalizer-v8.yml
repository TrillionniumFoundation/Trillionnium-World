name: tmp-world-plan-v4-atomic-finalizer-v8

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-atomic-finalizer-v8.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: tmp-world-plan-v4-atomic-finalizer-v8
  cancel-in-progress: false

env:
  REPOSITORY: TrillionniumFoundation/Trillionnium-World
  TARGET_BRANCH: fix/world-plan-v4-development-closure-20260831
  SOURCE_WORLD_HEAD: 5605cfb8861aa923f69ff032ddbff7d035bccb0c
  CONTROL_HEAD: 68e9631b3fc3f75f332497f8d0551608bf0e1413
  EXPECTED_PATCH_SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f
  EXPECTED_QUALIFIED_TREE: 5e613185f5a2abda42df371f3755e73667717309
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  publish:
    name: publish-qualified-tree
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      final_sha: ${{ steps.publish.outputs.final_sha }}
      final_tree: ${{ steps.publish.outputs.final_tree }}
    steps:
      - name: Reconstruct and qualify immutable World source
        shell: bash
        env:
          TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "0"
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          test "$(sha256sum export/world-v13-source.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git -C candidate add -A
          test "$(git -C candidate write-tree)" = "${EXPECTED_QUALIFIED_TREE}"
          test ! -e candidate/trillionnium/crates/trnm-game-server/build.rs
          test ! -e candidate/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' candidate/trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' candidate/trillionnium/crates/trnm-game-server
          printf 'TRNM_WORLD_SOURCE_QUALIFICATION=PASS\n'

      - name: Publish exact source and governance commits atomically
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_branch = os.environ["TARGET_BRANCH"]
          bootstrap_sha = os.environ["BOOTSTRAP_SHA"]
          source_head = os.environ["SOURCE_WORLD_HEAD"]
          expected_tree = os.environ["EXPECTED_QUALIFIED_TREE"]
          root = Path("candidate")

          def api(method, path, payload=None, allow=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trnm-world-plan-v4-atomic-finalizer-v8",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  if allow and error.code in allow:
                      return {"http_status": error.code, "body": body}
                  raise SystemExit(f"{method} {path} failed {error.code}: {body}")

          encoded_branch = urllib.parse.quote(target_branch, safe="")
          current = api("GET", f"/repos/{repo}/branches/{encoded_branch}")
          if current["commit"]["sha"] != bootstrap_sha:
              raise SystemExit(
                  f"bootstrap lost branch ownership: expected={bootstrap_sha} observed={current['commit']['sha']}"
              )

          independent = []
          for login in ("ProfHepta", "Franksudoman"):
              result = api(
                  "GET",
                  f"/repos/{repo}/collaborators/{login}/permission",
                  allow={403, 404},
              )
              permission = result.get("permission") if isinstance(result, dict) else None
              if permission in {"admin", "maintain", "write"}:
                  independent.append(login)
          if not independent:
              raise SystemExit("no independent CODEOWNER with write permission is available")

          source_commit = api("GET", f"/repos/{repo}/git/commits/{source_head}")
          source_base_tree = source_commit["tree"]["sha"]
          raw = subprocess.check_output(
              ["git", "-C", str(root), "diff", "--cached", "--name-only", "-z"]
          )
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          if len(paths) < 50:
              raise SystemExit(f"candidate path inventory is unexpectedly small: {len(paths)}")

          source_entries = []
          for relative in paths:
              path = root / relative
              if not path.exists():
                  source_entries.append({"path": relative, "mode": "100644", "type": "blob", "sha": None})
                  continue
              if not path.is_file():
                  raise SystemExit(f"unsupported non-file path: {relative}")
              index_line = subprocess.check_output(
                  ["git", "-C", str(root), "ls-files", "-s", "--", relative], text=True
              ).strip()
              mode = index_line.split(None, 1)[0]
              if mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported mode {mode}: {relative}")
              blob = api(
                  "POST",
                  f"/repos/{repo}/git/blobs",
                  {
                      "content": base64.b64encode(path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              source_entries.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})

          source_tree = api(
              "POST",
              f"/repos/{repo}/git/trees",
              {"base_tree": source_base_tree, "tree": source_entries},
          )
          if source_tree["sha"] != expected_tree:
              raise SystemExit(
                  f"qualified source tree mismatch: expected={expected_tree} observed={source_tree['sha']}"
              )

          source_commit = api(
              "POST",
              f"/repos/{repo}/git/commits",
              {
                  "message": (
                      "fix(world): publish exact qualified Plan V4 direct-source tree\n\n"
                      "Source-World-Head: 5605cfb8861aa923f69ff032ddbff7d035bccb0c\n"
                      "Qualification-Control-Head: 68e9631b3fc3f75f332497f8d0551608bf0e1413\n"
                      "Qualified-Tree: 5e613185f5a2abda42df371f3755e73667717309\n"
                      "Patch-SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f\n"
                  ),
                  "tree": expected_tree,
                  "parents": [bootstrap_sha],
              },
          )
          source_sha = source_commit["sha"]

          owner_tokens = " ".join("@" + login for login in independent)
          codeowners = f"""# Trillionnium World independent ownership\n* @Tomasrgbsf {owner_tokens}\n\n/.github/workflows/ {owner_tokens}\n/.github/CODEOWNERS {owner_tokens}\n/CURRENT_PLAN.md {owner_tokens}\n/docs/adr/ {owner_tokens}\n/docs/protocol/ {owner_tokens}\n/docs/status/ {owner_tokens}\n/scripts/ {owner_tokens}\n/trillionnium/contracts/ {owner_tokens}\n/trillionnium/crates/trnm-campaign-core/ {owner_tokens}\n/trillionnium/crates/trnm-rts-sim/ {owner_tokens}\n/trillionnium/crates/trnm-game-server/ {owner_tokens}\n/trillionnium/crates/trnm-game-server/migrations/ {owner_tokens}\n"""

          ledger = {
              "schema": "trnm_world_plan_v4_source_closure_v1",
              "plan": "trillionnium-world-development-2026-08-29-v4",
              "source_world_head": os.environ["SOURCE_WORLD_HEAD"],
              "qualification_control_head": os.environ["CONTROL_HEAD"],
              "qualification_run_id": 33452853784,
              "qualification_artifact_id": 9780499701,
              "qualification_artifact_digest": "sha256:456a181bdc8f8aa248229b044db9eec4f52572ea3b20bca6492907db58d64ef5",
              "patch_sha256": os.environ["EXPECTED_PATCH_SHA256"],
              "qualified_source_tree": expected_tree,
              "qualified_source_commit": source_sha,
              "rust_toolchain": os.environ["RUST_TOOLCHAIN"],
              "world_owned_source_development_closed": True,
              "repository_review_closed": False,
              "all_plan_gaps_closed": False,
              "external_evidence_gaps": {
                  "nakama_canonical_authority": "open",
                  "trusted_cex_custody_and_settlement": "open",
                  "deployment_and_public_edge": "open",
                  "cross_host_recovery_and_endurance": "open",
                  "human_and_accessibility_validation": "open",
                  "privacy_legal_support_and_commercial": "open",
              },
              "evidence_rule": "source and CI cannot satisfy deployment, custody, human, legal, or commercial evidence",
          }
          ledger_text = json.dumps(ledger, indent=2, sort_keys=True) + "\n"

          closure_workflow = """name: trnm-world-v4-closure-contract\n\non:\n  pull_request:\n  push:\n    branches: [main, fix/world-plan-v4-development-closure-20260831]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: trnm-world-v4-closure-contract-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  closure-contract:\n    name: trnm-world-v4/closure-contract\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n      - name: Checkout exact commit without persistent credentials\n        shell: bash\n        run: |\n          set -euo pipefail\n          git init repository\n          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git\n          git -C repository fetch --no-tags --depth=2 origin \"${GITHUB_SHA}\"\n          git -C repository checkout --detach FETCH_HEAD\n          test \"$(git -C repository rev-parse HEAD)\" = \"${GITHUB_SHA}\"\n      - name: Verify direct-source and evidence boundaries\n        shell: bash\n        run: |\n          set -euo pipefail\n          cd repository\n          test ! -e trillionnium/crates/trnm-game-server/build.rs\n          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in\n          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' trillionnium/crates/trnm-game-server\n          ! grep -R --line-number --fixed-strings 'include!(concat!(env!(\"OUT_DIR\")' trillionnium/crates/trnm-game-server\n          python3 - <<'PY2'\n          import json, pathlib\n          ledger=json.loads(pathlib.Path('docs/status/world-plan-v4-source-closure-v1.json').read_text())\n          assert ledger['qualified_source_tree']=='5e613185f5a2abda42df371f3755e73667717309'\n          assert ledger['patch_sha256']=='ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f'\n          assert ledger['world_owned_source_development_closed'] is True\n          assert ledger['repository_review_closed'] is False\n          assert ledger['all_plan_gaps_closed'] is False\n          for value in ledger['external_evidence_gaps'].values(): assert value=='open'\n          PY2\n          grep -Eq '@ProfHepta|@Franksudoman' .github/CODEOWNERS\n          ! find . -type f \\( -name '*probe*' -o -name '*.rs.in' \\) -not -path './.git/*' -print -quit | grep -q .\n          test \"$(python3 - <<'PY2'\n          import tomllib\n          print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])\n          PY2\n          )\" = '1.98.0'\n          source_commit=$(python3 - <<'PY2'\n          import json\n          print(json.load(open('docs/status/world-plan-v4-source-closure-v1.json'))['qualified_source_commit'])\n          PY2\n          )\n          git cat-file -e \"${source_commit}^{commit}\"\n          changed=$(git diff --name-only \"${source_commit}\" HEAD)\n          while IFS= read -r path; do\n            case \"$path\" in\n              .github/CODEOWNERS|.github/workflows/trnm-world-v4-closure-contract.yml|docs/status/world-plan-v4-source-closure-v1.json) ;;\n              '') ;;\n              *) echo \"unexpected post-qualification path: $path\" >&2; exit 1 ;;\n            esac\n          done <<< \"$changed\"\n          printf 'TRNM_WORLD_V4_CLOSURE_CONTRACT=PASS\\n'\n"""

          governance_files = {
              ".github/CODEOWNERS": codeowners,
              ".github/workflows/trnm-world-v4-closure-contract.yml": closure_workflow,
              "docs/status/world-plan-v4-source-closure-v1.json": ledger_text,
          }
          governance_entries = []
          for path, content in governance_files.items():
              blob = api(
                  "POST",
                  f"/repos/{repo}/git/blobs",
                  {"content": content, "encoding": "utf-8"},
              )
              governance_entries.append(
                  {"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]}
              )
          final_tree = api(
              "POST",
              f"/repos/{repo}/git/trees",
              {"base_tree": expected_tree, "tree": governance_entries},
          )
          final_commit = api(
              "POST",
              f"/repos/{repo}/git/commits",
              {
                  "message": (
                      "governance(world): bind qualified source to independent closure controls\n\n"
                      f"Qualified-Source-Commit: {source_sha}\n"
                      f"Qualified-Source-Tree: {expected_tree}\n"
                  ),
                  "tree": final_tree["sha"],
                  "parents": [source_sha],
              },
          )
          final_sha = final_commit["sha"]

          current_again = api("GET", f"/repos/{repo}/branches/{encoded_branch}")
          if current_again["commit"]["sha"] != bootstrap_sha:
              raise SystemExit("target branch moved during qualification")
          api(
              "PATCH",
              f"/repos/{repo}/git/refs/heads/{target_branch}",
              {"sha": final_sha, "force": False},
          )
          readback = api("GET", f"/repos/{repo}/git/commits/{final_sha}")
          if readback["tree"]["sha"] != final_tree["sha"]:
              raise SystemExit("final tree read-back mismatch")
          branch = api("GET", f"/repos/{repo}/branches/{encoded_branch}")
          if branch["commit"]["sha"] != final_sha:
              raise SystemExit("final ref read-back mismatch")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"final_sha={final_sha}\n")
              handle.write(f"final_tree={final_tree['sha']}\n")
          print(f"TRNM_WORLD_SOURCE_COMMIT={source_sha}")
          print(f"TRNM_WORLD_FINAL_COMMIT={final_sha}")
          print(f"TRNM_WORLD_FINAL_TREE={final_tree['sha']}")
          print("TRNM_WORLD_ATOMIC_PUBLICATION=PASS")
          PY

  docs-governance:
    name: trnm-world-v4/docs-governance
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set pending status
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"trnm-world-v4/docs-governance\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Verify exact final governance tree
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; state=success; test $rc -eq 0 || state=failure; curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"${state}\",\"context\":\"trnm-world-v4/docs-governance\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null; exit $rc' EXIT
          git init repository
          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C repository fetch --no-tags --depth=3 origin "${FINAL_SHA}"
          git -C repository checkout --detach FETCH_HEAD
          test "$(git -C repository rev-parse HEAD)" = "${FINAL_SHA}"
          cd repository
          test ! -e .github/workflows/tmp-world-plan-v4-atomic-finalizer-v8.yml
          test ! -e trillionnium/crates/trnm-game-server/build.rs
          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in
          python3 -m json.tool docs/status/world-plan-v4-source-closure-v1.json >/dev/null
          grep -Eq '@ProfHepta|@Franksudoman' .github/CODEOWNERS
          test -f .github/workflows/trnm-world-v4-closure-contract.yml
          ! find . -type f \\( -name '*probe*' -o -name '*.rs.in' \\) -not -path './.git/*' -print -quit | grep -q .
          python3 - <<'PY'
          import json
          ledger=json.load(open('docs/status/world-plan-v4-source-closure-v1.json'))
          assert ledger['qualified_source_tree']=='5e613185f5a2abda42df371f3755e73667717309'
          assert ledger['world_owned_source_development_closed'] is True
          assert ledger['repository_review_closed'] is False
          assert ledger['all_plan_gaps_closed'] is False
          PY

  transition-contract:
    name: trnm-world-v4/transition-contract
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify transition contract
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; state=success; test $rc -eq 0 || state=failure; curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"${state}\",\"context\":\"trnm-world-v4/transition-contract\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null; exit $rc' EXIT
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"pending\",\"context\":\"trnm-world-v4/transition-contract\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          git init repository
          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C repository fetch --no-tags --depth=1 origin "${FINAL_SHA}"
          git -C repository checkout --detach FETCH_HEAD
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          cd repository
          python3 scripts/check-trnm-world-transition-conformance.py
          cargo test --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml --locked
          cargo clippy --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml --all-targets --locked -- -D warnings

  settlement-postgres:
    name: trnm-world-v4/settlement-postgres
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: trnm
          POSTGRES_PASSWORD: trnm
          POSTGRES_DB: trnm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trnm -d trnm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: postgres://trnm:trnm@127.0.0.1:5432/trnm
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "1"
    steps:
      - name: Verify PostgreSQL settlement contracts
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; state=success; test $rc -eq 0 || state=failure; curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"${state}\",\"context\":\"trnm-world-v4/settlement-postgres\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null; exit $rc' EXIT
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"pending\",\"context\":\"trnm-world-v4/settlement-postgres\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          git init repository
          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C repository fetch --no-tags --depth=1 origin "${FINAL_SHA}"
          git -C repository checkout --detach FETCH_HEAD
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          cd repository/trillionnium
          cargo test -p trnm-game-server --test settlement_database_contract --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_fault_model --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_worker_contract --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_runtime_v2_contract --locked -- --nocapture

  game-workspace-release:
    name: trnm-world-v4/game-workspace-release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify Rust workspace, direct source and release build
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; state=success; test $rc -eq 0 || state=failure; curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"${state}\",\"context\":\"trnm-world-v4/game-workspace-release\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null; exit $rc' EXIT
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"pending\",\"context\":\"trnm-world-v4/game-workspace-release\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          git init repository
          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C repository fetch --no-tags --depth=2 origin "${FINAL_SHA}"
          git -C repository checkout --detach FETCH_HEAD
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          cd repository
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test direct_source_bundle --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test direct_cex_source_contract --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server --all-targets --locked -- -D warnings
          cargo build --manifest-path trillionnium/Cargo.toml -p trnm-game-server --release --locked

  supply-chain:
    name: trnm-world-v4/supply-chain
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify immutable workflow and dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; state=success; test $rc -eq 0 || state=failure; curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"${state}\",\"context\":\"trnm-world-v4/supply-chain\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null; exit $rc' EXIT
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -d "{\"state\":\"pending\",\"context\":\"trnm-world-v4/supply-chain\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          git init repository
          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C repository fetch --no-tags --depth=1 origin "${FINAL_SHA}"
          git -C repository checkout --detach FETCH_HEAD
          cd repository
          test -f trillionnium/Cargo.lock
          cargo metadata --manifest-path trillionnium/Cargo.toml --locked --no-deps >/tmp/metadata.json
          python3 - <<'PY'
          import json, pathlib, re
          json.load(open('/tmp/metadata.json'))
          bad=[]
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              text=path.read_text()
              for match in re.finditer(r'uses:\s*([^\s#]+)', text):
                  value=match.group(1)
                  if value.startswith('./') or re.search(r'@[0-9a-f]{40}$', value):
                      continue
                  bad.append(f'{path}:{value}')
              if re.search(r'permissions:\s*\n\s*contents:\s*write', text) and 'tmp-' not in path.name:
                  bad.append(f'{path}:write-permission')
          if bad:
              raise SystemExit('mutable supply-chain boundary: ' + ', '.join(bad))
          for forbidden in ('git = ', 'branch = ', 'rev = '):
              if forbidden in pathlib.Path('trillionnium/Cargo.toml').read_text():
                  raise SystemExit(f'forbidden root dependency selector: {forbidden}')
          PY
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])
          PY
          )" = "1.98.0"

  finalize:
    name: request-independent-review
    needs:
      - publish
      - docs-governance
      - transition-contract
      - settlement-postgres
      - game-workspace-release
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_SHA: ${{ needs.publish.outputs.final_sha }}
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      FINAL_TREE: ${{ needs.publish.outputs.final_tree }}
    steps:
      - name: Publish aggregate exact-head status and request independent review
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/qualified-source-exact-head\",\"description\":\"qualified source and five exact-head gates passed\",\"target_url\":\"${run_url}\"}" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/issues/46/comments" \
            -d "$(python3 - <<'PY'
          import json, os
          body=f'''Plan V4 exact-head candidate published and qualified.\n\n- source commit: `{os.environ['SOURCE_SHA']}`\n- final head: `{os.environ['FINAL_SHA']}`\n- final tree: `{os.environ['FINAL_TREE']}`\n- qualified source tree: `5e613185f5a2abda42df371f3755e73667717309`\n- qualification run: `33452853784`\n- current run: `{os.environ['GITHUB_RUN_ID']}`\n\nAll five source/gate contexts completed successfully on the final SHA. The PR remains Draft and unmerged pending a fresh independent latest-head approval. Deployment, custody, public-online, player-market, human-validation, legal and commercial denominators remain fail-closed.'''
          print(json.dumps({'body':body}))
          PY
          )" >/dev/null
          for reviewer in ProfHepta Franksudoman; do
            curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${api}/pulls/46/requested_reviewers" \
              -d "{\"reviewers\":[\"${reviewer}\"]}" >/dev/null || true
          done
          for branch in chore/world-object-import-v13k-20260901 tmp/api-payload-path-probe-20260831; do
            encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$branch")
            curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${api}/git/refs/heads/${encoded}" >/dev/null || true
          done
          printf 'TRNM_WORLD_V4_EXACT_HEAD_MATRIX=PASS\n'
          printf 'TRNM_WORLD_V4_INDEPENDENT_REVIEW_REQUESTED=PASS\n'
