name: tmp-world-runner-native-probe-20260906-b

on:
  push:
    branches:
      - ops/world-runner-native-probe-20260906-b
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-world-runner-native-probe-20260906-b
  cancel-in-progress: true

jobs:
  runner-native-probe:
    name: tmp-world/runner-native-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact commit with runner-provided git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE}"/.[!.]* "${GITHUB_WORKSPACE}"/..?* 2>/dev/null || true
          git -C "${GITHUB_WORKSPACE}" init
          git -C "${GITHUB_WORKSPACE}" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${GITHUB_WORKSPACE}" -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD
          test "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" = "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Emit immutable scheduler identity
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          printf 'repository=%s\nhead=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "${GITHUB_REPOSITORY}" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}"
      - name: Read-only project admission
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          bash scripts/project-preflight.sh
          python3 -m py_compile scripts/check-trnm-world-ci-integrity.py
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=all | test ! -s /dev/stdin
