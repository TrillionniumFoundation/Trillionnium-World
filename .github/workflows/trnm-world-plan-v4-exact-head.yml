name: trnm-world-plan-v4-exact-head

on:
  push:
    branches:
      - fix/world-plan-v4-convergence-2026-08-30
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/trnm-world-plan-v4-exact-head.yml'
      - 'CURRENT_PLAN.md'
      - 'docs/**'
      - 'scripts/**'
      - 'trillionnium/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-plan-v4-exact-head-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  truth-and-static:
    name: world-v4 / truth-and-static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s\n' "commit=${GITHUB_SHA}" "tree=$(git rev-parse HEAD^{tree})" "event=${GITHUB_EVENT_NAME}"
          test -z "$(git status --porcelain)"
      - name: Validate machine-readable truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('docs/development/trillionnium-world-development-plan-2026-08-29.json'),
              Path('docs/development/trnm-world-gap-closure-ledger-v4.json'),
              Path('docs/status/world-v4-convergence-state-2026-08-30.json'),
              Path('docs/status/world-gates-v1.json'),
          ]
          for path in required:
              with path.open('rb') as handle:
                  json.load(handle)
              print(f'validated_json={path}')
          PY
          if test -f scripts/check-trnm-world-v4-convergence.py; then
            python3 scripts/check-trnm-world-v4-convergence.py
          fi
          if test -f scripts/check-trnm-settlement-transaction-boundary.sh; then
            bash scripts/check-trnm-settlement-transaction-boundary.sh
          fi
          if test -f scripts/check_trnm_settlement_transaction_boundary.sh; then
            bash scripts/check_trnm_settlement_transaction_boundary.sh
          fi
          git diff --check
          test -z "$(git status --porcelain)"

  rust-workspace:
    name: world-v4 / rust-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose
      - name: Format, build, test and lint complete workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked -- -D warnings
          test -z "$(git status --porcelain)"

  postgres-settlement:
    name: world-v4 / postgres-settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: trnm
          POSTGRES_PASSWORD: trnm_ci_only
          POSTGRES_DB: trnm_world
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trnm -d trnm_world"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://trnm:trnm_ci_only@127.0.0.1:5432/trnm_world
      TEST_DATABASE_URL: postgres://trnm:trnm_ci_only@127.0.0.1:5432/trnm_world
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - name: Execute non-empty PostgreSQL-bound server tests
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c 'select version();'
          cargo test --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --all-targets -- --test-threads=1
          test -z "$(git status --porcelain)"

  package-and-supply-chain:
    name: world-v4 / package-and-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - name: Verify lock, metadata, packages and repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path trillionnium/Cargo.toml --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/metadata.json', encoding='utf-8'))
          packages = data.get('packages', [])
          if not packages:
              raise SystemExit('workspace metadata is empty')
          print(f'workspace_packages={len(packages)}')
          PY
          cargo package --manifest-path trillionnium/crates/trnm-game-server/Cargo.toml --locked --allow-dirty --no-verify
          if test -f deny.toml; then
            cargo install cargo-deny --locked --version 0.18.3
            cargo deny --manifest-path trillionnium/Cargo.toml check advisories bans licenses sources
          elif test -f trillionnium/deny.toml; then
            cargo install cargo-deny --locked --version 0.18.3
            cargo deny --manifest-path trillionnium/Cargo.toml check advisories bans licenses sources
          fi
          git diff --check
          test -z "$(git status --porcelain)"
