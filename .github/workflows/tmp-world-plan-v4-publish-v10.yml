# merge-trigger-v11
name: tmp-world-plan-v4-publish-v10

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-publish-v10.yml

permissions:
  contents: write

concurrency:
  group: tmp-world-plan-v4-publish-v10
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/world-plan-v4-development-closure-20260831
  SOURCE_WORLD_HEAD: 5605cfb8861aa923f69ff032ddbff7d035bccb0c
  CONTROL_HEAD: 68e9631b3fc3f75f332497f8d0551608bf0e1413
  EXPECTED_PATCH_SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f
  EXPECTED_QUALIFIED_TREE: 5e613185f5a2abda42df371f3755e73667717309
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  publish:
    name: publish-exact-qualified-source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct, verify, and fast-forward exact source tree
        shell: bash
        run: |
          set -euo pipefail

          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST=0 \
            bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
              "$GITHUB_WORKSPACE/candidate" \
              "$GITHUB_WORKSPACE/control" \
              "$GITHUB_WORKSPACE/export"

          test "$(sha256sum export/world-v13-source.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git -C candidate add -A
          qualified_tree="$(git -C candidate write-tree)"
          test "${qualified_tree}" = "${EXPECTED_QUALIFIED_TREE}"
          test ! -e candidate/trillionnium/crates/trnm-game-server/build.rs
          test ! -e candidate/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' candidate/trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' candidate/trillionnium/crates/trnm-game-server

          observed="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${observed}" = "${GITHUB_SHA}"
          git -C candidate fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C candidate cat-file -e "${GITHUB_SHA}^{commit}"

          export GIT_AUTHOR_NAME='Trillionnium World Source Finalizer'
          export GIT_AUTHOR_EMAIL='world-source-finalizer@users.noreply.github.com'
          export GIT_COMMITTER_NAME='Trillionnium World Source Finalizer'
          export GIT_COMMITTER_EMAIL='world-source-finalizer@users.noreply.github.com'
          source_commit="$(printf '%s\n' \
            'fix(world): publish exact qualified Plan V4 direct-source tree' \
            '' \
            "Source-World-Head: ${SOURCE_WORLD_HEAD}" \
            "Qualification-Control-Head: ${CONTROL_HEAD}" \
            "Qualified-Tree: ${EXPECTED_QUALIFIED_TREE}" \
            "Patch-SHA256: ${EXPECTED_PATCH_SHA256}" \
            | git -C candidate commit-tree "${qualified_tree}" -p "${GITHUB_SHA}")"

          git -C candidate push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${source_commit}:refs/heads/${TARGET_BRANCH}"

          readback="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${readback}" = "${source_commit}"
          printf 'TRNM_WORLD_QUALIFIED_SOURCE_COMMIT=%s\n' "${source_commit}"
          printf 'TRNM_WORLD_QUALIFIED_SOURCE_TREE=%s\n' "${qualified_tree}"
          printf 'TRNM_WORLD_V10_PUBLICATION=PASS\n'
