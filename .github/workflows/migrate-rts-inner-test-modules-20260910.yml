name: migrate-rts-inner-test-modules-20260910

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write

concurrency:
  group: migrate-rts-inner-test-modules-20260910
  cancel-in-progress: false

jobs:
  verify_and_apply:
    name: world/verify-and-fast-forward-rts-test-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: refactor/campaign-module-stack-v2-20260909
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Fetch current target and this exact helper revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/target"
          helper="$RUNNER_TEMP/helper"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$target" "$helper"
          git init "$target"
          git -C "$target" remote add origin "$remote_url"
          git -C "$target" fetch --no-tags --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          git -C "$target" checkout --detach FETCH_HEAD
          git -C "$target" rev-parse HEAD > "$RUNNER_TEMP/original-head"
          git init "$helper"
          git -C "$helper" remote add origin "$remote_url"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/patch-rts-inner-test-modules.py"

      - name: Apply the compile-owned module migration
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/target"
          python3 "$RUNNER_TEMP/helper/scripts/patch-rts-inner-test-modules.py" "$target"
          git -C "$target" diff --check
          changed="$(git -C "$target" diff --name-only | sort)"
          expected="$(printf '%s\n' \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs | sort)"
          test "$changed" = "$expected"

      - name: Verify formatting, crate behavior, and include boundary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cd "$RUNNER_TEMP/target"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-rts-sim \
            --all-targets --locked
          python3 scripts/test-trnm-world-include-boundaries.py
          python3 scripts/check-trnm-world-include-boundaries.py

      - name: Commit and non-force fast-forward current target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/target"
          original="$(cat "$RUNNER_TEMP/original-head")"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote_url" "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$original"
          git -C "$target" config user.name github-actions[bot]
          git -C "$target" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$target" add \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs
          git -C "$target" commit -m "refactor(rts): replace inner test includes with Rust modules"
          new_head="$(git -C "$target" rev-parse HEAD)"
          git -C "$target" push "$remote_url" "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote "$remote_url" "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$new_head"
          printf 'WORLD_TARGET_HEAD=%s\n' "$new_head"
          printf 'RTS_INCLUDE_SEAMS_REMOVED=3\n'
          printf 'FAST_FORWARD_ONLY=true\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
