name: world-exact-tuple-qualification-v5

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: world-exact-tuple-qualification-v5
  cancel-in-progress: false

jobs:
  qualify:
    name: world-tuple/head-and-prospective-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trillionnium_world_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trillionnium_world_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TARGET_BRANCH: refactor/campaign-module-stack-v2-20260909
      BASE_BRANCH: main
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
      PGPASSWORD: postgres
    steps:
      - name: Freeze live tuple after the P0 repair
        id: tuple
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          ready=false
          for _ in $(seq 1 180); do
            head="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            base="$(git ls-remote "$remote" "refs/heads/$BASE_BRANCH" | awk '{print $1}')"
            test -n "$head"
            test -n "$base"
            rm -rf "$RUNNER_TEMP/probe"
            git init -q "$RUNNER_TEMP/probe"
            git -C "$RUNNER_TEMP/probe" remote add origin "$remote"
            git -C "$RUNNER_TEMP/probe" fetch -q --no-tags origin "$head"
            git -C "$RUNNER_TEMP/probe" checkout -q --detach FETCH_HEAD
            if grep -Fq 'fn statement_let_at(bytes: &[u8], start: usize) -> bool' \
              "$RUNNER_TEMP/probe/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'WORLD_BASE_SHA=%s\n' "$base"
          printf 'WORLD_HEAD_SHA=%s\n' "$head"

      - name: Materialize exact head and GitHub-order prospective merge
        shell: bash
        env:
          BASE_SHA: ${{ steps.tuple.outputs.base }}
          HEAD_SHA: ${{ steps.tuple.outputs.head }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          for surface in head merge; do
            work="$RUNNER_TEMP/$surface"
            rm -rf "$work"
            git init -q "$work"
            git -C "$work" remote add origin "$remote"
            git -C "$work" fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            if test "$surface" = head; then
              git -C "$work" checkout -q --detach "$HEAD_SHA"
            else
              git -C "$work" config user.name 'World exact tuple runner'
              git -C "$work" config user.email 'world-tuple@invalid.example'
              git -C "$work" checkout -q --detach "$BASE_SHA"
              git -C "$work" merge -q --no-ff --no-edit "$HEAD_SHA"
              parents="$(git -C "$work" show -s --format='%P' HEAD)"
              test "$parents" = "$BASE_SHA $HEAD_SHA"
              printf 'WORLD_PROSPECTIVE_MERGE_SHA=%s\n' "$(git -C "$work" rev-parse HEAD)"
              printf 'WORLD_PROSPECTIVE_MERGE_TREE=%s\n' "$(git -C "$work" rev-parse 'HEAD^{tree}')"
            fi
            test -z "$(git -C "$work" status --porcelain=v1 --untracked-files=no)"
          done

      - name: Install exact toolchain once
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
          psql --version

      - name: Qualify head and prospective merge completely
        shell: bash
        run: |
          set -euo pipefail
          for surface in head merge; do
            work="$RUNNER_TEMP/$surface"
            printf 'WORLD_SURFACE_BEGIN=%s\n' "$surface"
            cd "$work"
            git diff --check
            python3 scripts/check-trnm-world-component-catalog.py
            python3 scripts/test-trnm-world-component-catalog.py
            python3 scripts/check-trnm-world-include-boundaries.py
            python3 scripts/test-trnm-world-include-boundaries.py
            cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
            cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
            cargo clippy --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked -- -D warnings
            cargo build --manifest-path trillionnium/Cargo.toml --workspace --release --locked

            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c 'drop database if exists trillionnium_world_test with (force);'
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c 'create database trillionnium_world_test;'
            DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/trillionnium_world_test' \
            TEST_DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/trillionnium_world_test' \
              cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked -- --test-threads=1

            python3 - <<'PY' > "$RUNNER_TEMP/${surface}-publishable.txt"
          import json
          import subprocess
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--manifest-path', 'trillionnium/Cargo.toml',
              '--format-version', '1', '--no-deps', '--locked'
          ]))
          members = set(metadata['workspace_members'])
          names = []
          for package in metadata['packages']:
              if package['id'] not in members or package.get('publish') == []:
                  continue
              names.append(package['name'])
          for name in sorted(set(names)):
              print(name)
          PY
            test -s "$RUNNER_TEMP/${surface}-publishable.txt"
            while IFS= read -r package; do
              cargo package --manifest-path trillionnium/Cargo.toml \
                -p "$package" --locked --allow-dirty
            done < "$RUNNER_TEMP/${surface}-publishable.txt"
            printf 'WORLD_SURFACE_PASS=%s\n' "$surface"
          done

      - name: Reject tuple movement and record CI-only result
        shell: bash
        env:
          BASE_SHA: ${{ steps.tuple.outputs.base }}
          HEAD_SHA: ${{ steps.tuple.outputs.head }}
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          live_base="$(git ls-remote "$remote" "refs/heads/$BASE_BRANCH" | awk '{print $1}')"
          live_head="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$live_base" = "$BASE_SHA"
          test "$live_head" = "$HEAD_SHA"
          printf 'WORLD_EXACT_TUPLE_QUALIFICATION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          body = (
              'Exact-tuple repository execution passed on the unchanged World head and '
              'GitHub-order prospective merge.\n\n'
              f"- base: `{os.environ['BASE_SHA']}`\n"
              f"- head: `{os.environ['HEAD_SHA']}`\n"
              '- closed-world truth/parser gates: success on both surfaces\n'
              '- full Rust test/Clippy/release build: success on both surfaces\n'
              '- PostgreSQL-aware workspace tests: success on both surfaces\n'
              '- publishable package verification: success on both surfaces\n'
              '- production authorization: `not_granted`\n\n'
              'This records repository CI execution only. It is not independent review, '
              'production-adapter evidence, deployment approval, or release authorization.'
          )
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/115/comments',
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_WRITE_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=60):
              pass
          PY
