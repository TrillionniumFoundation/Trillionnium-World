name: trnm-world-postgres-cutover

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'
  push:
    branches: [main, 'feat/p0-world-authority-cutover-*']
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-postgres-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres

jobs:
  postgres-cutover:
    name: trnm-world-postgres-cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact World source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and migration closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain)"
          for path in \
            deploy/postgres/trnm-world-authority-cutover-v1.sql \
            deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql \
            scripts/apply-trnm-world-authority-cutover-v1.sh \
            scripts/check-trnm-world-authority-postgres.sh \
            scripts/check-trnm-world-authority-postgres-installation.sh \
            scripts/run-trnm-world-authority-postgres-check.sh; do
            test -s "$path"
          done

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          test "$(psql -X -Atc 'show server_version_num' | cut -c1-2)" = "16"

      - name: Run durable migration state machine and installation hostile matrix
        id: postgres
        shell: bash
        env:
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-postgres
        run: bash scripts/run-trnm-world-authority-postgres-check.sh

      - name: Record truth-bound exact-SHA evidence
        if: always()
        shell: bash
        env:
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-postgres
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path('run/world-authority-postgres')

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args], check=True, text=True, stdout=subprocess.PIPE
              ).stdout.strip()

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          outcome = os.environ.get('POSTGRES_OUTCOME', 'skipped')
          evidence = {
              'schema': 'trillionnium.world.postgres-cutover-exact-sha.v3',
              'status': 'qualified' if outcome == 'success' else 'failed_or_incomplete',
              'postgres_outcome': outcome,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': git('rev-parse', 'HEAD^{tree}'),
              'base_migration_blob': git('rev-parse', 'HEAD:deploy/postgres/trnm-world-authority-cutover-v1.sql'),
              'hardening_migration_blob': git('rev-parse', 'HEAD:deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'),
              'installer_blob': git('rev-parse', 'HEAD:scripts/apply-trnm-world-authority-cutover-v1.sh'),
              'state_checker_blob': git('rev-parse', 'HEAD:scripts/check-trnm-world-authority-postgres.sh'),
              'installation_checker_blob': git('rev-parse', 'HEAD:scripts/check-trnm-world-authority-postgres-installation.sh'),
              'psql_adapter_blob': git('rev-parse', 'HEAD:scripts/run-trnm-world-authority-postgres-check.sh'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'production_authorization': 'not_granted',
          }
          (out / 'exact-sha-identity.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          files = sorted(path for path in out.iterdir() if path.is_file() and path.name != 'artifact-manifest.json')
          manifest = {
              'schema': 'trillionnium.world.postgres-cutover-artifact-manifest.v3',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'files': [
                  {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha256(path)}
                  for path in files
              ],
          }
          (out / 'artifact-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload immutable PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-postgres-${{ env.SOURCE_HEAD_SHA }}
          path: run/world-authority-postgres/**
          if-no-files-found: error
          retention-days: 90
