name: trnm-world-postgres-cutover

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'
  push:
    branches:
      - main
      - 'fix/world-*'
      - 'integration/world-*'
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-postgres-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  MERGE_SHA: ${{ github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  POSTGRES_IMAGE_REF: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
  POSTGRES_IMAGE_DIGEST: sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres

jobs:
  postgres-cutover:
    name: trnm-world-postgres-cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize and bind exact objects
        id: objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          merge_dir=''
          merge_tree="$source_tree"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test -n "$PR_NUMBER"
            test -n "$BASE_SHA"
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/merge"
            test "$(git rev-parse FETCH_HEAD)" = "$MERGE_SHA"
            test "$(git rev-parse FETCH_HEAD^1)" = "$BASE_SHA"
            test "$(git rev-parse FETCH_HEAD^2)" = "$SOURCE_HEAD_SHA"
            merge_dir="$RUNNER_TEMP/trnm-world-postgres-merge"
            rm -rf "$merge_dir"
            git worktree add --detach "$merge_dir" "$MERGE_SHA"
            test "$(git -C "$merge_dir" rev-parse HEAD)" = "$MERGE_SHA"
            test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"
            merge_tree="$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')"
          fi
          {
            printf 'source_tree=%s\n' "$source_tree"
            printf 'merge_dir=%s\n' "$merge_dir"
            printf 'merge_tree=%s\n' "$merge_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Verify pinned PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$POSTGRES_IMAGE_REF" = "postgres:16.4-alpine@$POSTGRES_IMAGE_DIGEST"
          docker image inspect "$POSTGRES_IMAGE_REF" >/dev/null 2>&1 \
            || docker pull "$POSTGRES_IMAGE_REF" >/dev/null
          mkdir -p run/world-authority-postgres/environment
          docker image inspect "$POSTGRES_IMAGE_REF" \
            > run/world-authority-postgres/environment/image.json
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            "$POSTGRES_IMAGE_REF" \
            psql -Atqc 'show server_version' \
            | tee run/world-authority-postgres/environment/server-version.txt
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            "$POSTGRES_IMAGE_REF" \
            psql -Atqc 'show server_version_num' \
            | tee run/world-authority-postgres/environment/server-version-num.txt
          test "$(cat run/world-authority-postgres/environment/server-version-num.txt)" = '160004'

      - name: Qualify source-head PostgreSQL contracts
        id: source_postgres
        continue-on-error: true
        shell: bash
        env:
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-postgres/source
        run: bash scripts/run-trnm-world-authority-postgres-check.sh

      - name: Qualify actual GitHub merge PostgreSQL contracts
        id: merge_postgres
        if: ${{ github.event_name == 'pull_request' && steps.objects.outputs.merge_dir != '' }}
        continue-on-error: true
        shell: bash
        env:
          MERGE_DIR: ${{ steps.objects.outputs.merge_dir }}
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-postgres/merge
        run: bash "$MERGE_DIR/scripts/run-trnm-world-authority-postgres-check.sh"

      - name: Record exact evidence identity
        if: always()
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.objects.outputs.source_tree }}
          MERGE_TREE: ${{ steps.objects.outputs.merge_tree }}
          SOURCE_OUTCOME: ${{ steps.source_postgres.outcome }}
          MERGE_OUTCOME: ${{ steps.merge_postgres.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-postgres
          merge_outcome="$MERGE_OUTCOME"
          if test "$GITHUB_EVENT_NAME" != pull_request; then
            merge_outcome='not_applicable'
          fi
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'source_head=%s\n' "$SOURCE_HEAD_SHA"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'base=%s\n' "$BASE_SHA"
            printf 'merge=%s\n' "$MERGE_SHA"
            printf 'merge_tree=%s\n' "$MERGE_TREE"
            printf 'source_outcome=%s\n' "$SOURCE_OUTCOME"
            printf 'merge_outcome=%s\n' "$merge_outcome"
            printf 'postgres_image=%s\n' "$POSTGRES_IMAGE_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'production_authorization=not_granted\n'
          } > run/world-authority-postgres/identity.txt
          find run/world-authority-postgres -type f ! -name MANIFEST.sha256 \
            -print0 | sort -z | xargs -0 -r sha256sum \
            > run/world-authority-postgres/MANIFEST.sha256

      - name: Remove merge worktree
        if: ${{ always() && steps.objects.outputs.merge_dir != '' }}
        shell: bash
        env:
          MERGE_DIR: ${{ steps.objects.outputs.merge_dir }}
        run: git worktree remove --force "$MERGE_DIR"

      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-postgres-${{ env.SOURCE_HEAD_SHA }}-${{ github.run_attempt }}
          path: run/world-authority-postgres/**
          if-no-files-found: error
          retention-days: 90

      - name: Enforce complete result
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source_postgres.outcome }}
          MERGE_OUTCOME: ${{ steps.merge_postgres.outcome }}
        run: |
          set -euo pipefail
          test "$SOURCE_OUTCOME" = success
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$MERGE_OUTCOME" = success
          fi
          printf 'TRNM_WORLD_POSTGRES_CUTOVER=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
