name: trnm-world-postgres-cutover

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'
  push:
    branches: [main, 'feat/p0-world-authority-cutover-*']
    paths:
      - 'deploy/postgres/trnm-world-authority-cutover-v1.sql'
      - 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'
      - 'scripts/apply-trnm-world-authority-cutover-v1.sh'
      - 'scripts/check-trnm-world-authority-postgres.sh'
      - 'scripts/check-trnm-world-authority-postgres-installation.sh'
      - 'scripts/run-trnm-world-authority-postgres-check.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - '.github/workflows/trnm-world-postgres-cutover.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-postgres-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02
  POSTGRES_IMAGE_REF: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  POSTGRES_IMAGE_DIGEST: sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres

jobs:
  postgres-cutover:
    name: trnm-world-postgres-cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact World source head with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source, base and prospective-merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain)"

          source_tree="$(git rev-parse "${SOURCE_HEAD_SHA}^{tree}")"
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" && "$GITHUB_REF_NAME" != "main" ]]; then
            base_sha="$(git rev-parse origin/main)"
          fi

          if [[ -n "$base_sha" ]]; then
            git cat-file -e "${base_sha}^{commit}"
            base_tree="$(git rev-parse "${base_sha}^{tree}")"
            merge_tree_output="$(git merge-tree --write-tree "$base_sha" "$SOURCE_HEAD_SHA")"
            prospective_merge_tree="$(printf '%s\n' "$merge_tree_output" | head -n1)"
            [[ "$prospective_merge_tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='Trillionnium qualification'
            export GIT_AUTHOR_EMAIL='qualification@trillionnium.invalid'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            prospective_merge_commit="$(
              printf 'Synthetic prospective merge for PostgreSQL qualification only\n' \
                | git commit-tree "$prospective_merge_tree" -p "$base_sha" -p "$SOURCE_HEAD_SHA"
            )"
          else
            base_tree=''
            prospective_merge_tree="$source_tree"
            prospective_merge_commit="$SOURCE_HEAD_SHA"
          fi

          {
            echo "source_tree=$source_tree"
            echo "base_sha=$base_sha"
            echo "base_tree=$base_tree"
            echo "prospective_merge_tree=$prospective_merge_tree"
            echo "prospective_merge_commit=$prospective_merge_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact migration closure and pinned database environment
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            deploy/postgres/trnm-world-authority-cutover-v1.sql \
            deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql \
            scripts/apply-trnm-world-authority-cutover-v1.sh \
            scripts/check-trnm-world-authority-postgres.sh \
            scripts/check-trnm-world-authority-postgres-installation.sh \
            scripts/run-trnm-world-authority-postgres-check.sh; do
            test -s "$path"
          done
          [[ "$POSTGRES_IMAGE_REF" == *@"$POSTGRES_IMAGE_DIGEST" ]]
          docker image inspect "$POSTGRES_IMAGE_REF" >/dev/null 2>&1 \
            || docker pull "$POSTGRES_IMAGE_REF" >/dev/null

          mkdir -p run/world-authority-postgres/environment
          docker image inspect "$POSTGRES_IMAGE_REF" \
            > run/world-authority-postgres/environment/postgres-image-inspect.json
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$POSTGRES_IMAGE_REF" \
            | tee run/world-authority-postgres/environment/postgres-repo-digests.txt
          grep -F "$POSTGRES_IMAGE_DIGEST" \
            run/world-authority-postgres/environment/postgres-repo-digests.txt
          docker run --rm "$POSTGRES_IMAGE_REF" postgres --version \
            | tee run/world-authority-postgres/environment/postgres-server-version.txt
          docker run --rm "$POSTGRES_IMAGE_REF" psql --version \
            | tee run/world-authority-postgres/environment/postgres-client-version.txt
          grep -E '^psql \(PostgreSQL\) 16\.' \
            run/world-authority-postgres/environment/postgres-client-version.txt
          cat /etc/os-release > run/world-authority-postgres/environment/runner-os-release.txt
          uname -a > run/world-authority-postgres/environment/runner-uname.txt
          docker version > run/world-authority-postgres/environment/docker-version.txt

      - name: Run source-head durable and installation hostile matrices
        id: source_postgres
        continue-on-error: true
        shell: bash
        env:
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-postgres/source
        run: bash scripts/run-trnm-world-authority-postgres-check.sh

      - name: Materialize exact prospective-merge object
        id: merge_worktree
        if: ${{ always() && steps.identity.outcome == 'success' }}
        shell: bash
        env:
          PROSPECTIVE_MERGE_COMMIT: ${{ steps.identity.outputs.prospective_merge_commit }}
        run: |
          set -euo pipefail
          merge_dir="$RUNNER_TEMP/trnm-world-postgres-prospective-merge"
          rm -rf "$merge_dir"
          git worktree add --detach "$merge_dir" "$PROSPECTIVE_MERGE_COMMIT"
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$PROSPECTIVE_MERGE_COMMIT"
          test -z "$(git -C "$merge_dir" status --porcelain)"
          echo "path=$merge_dir" >> "$GITHUB_OUTPUT"

      - name: Run prospective-merge durable and installation hostile matrices
        id: merge_postgres
        if: ${{ always() && steps.merge_worktree.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          MERGE_WORKTREE: ${{ steps.merge_worktree.outputs.path }}
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-postgres/prospective-merge
        run: bash "$MERGE_WORKTREE/scripts/run-trnm-world-authority-postgres-check.sh"

      - name: Remove prospective-merge worktree
        if: ${{ always() && steps.merge_worktree.outputs.path != '' }}
        shell: bash
        env:
          MERGE_WORKTREE: ${{ steps.merge_worktree.outputs.path }}
        run: git worktree remove --force "$MERGE_WORKTREE"

      - name: Record truth-bound source, merge and environment evidence
        if: always()
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          BASE_TREE: ${{ steps.identity.outputs.base_tree }}
          PROSPECTIVE_MERGE_TREE: ${{ steps.identity.outputs.prospective_merge_tree }}
          PROSPECTIVE_MERGE_COMMIT: ${{ steps.identity.outputs.prospective_merge_commit }}
          SOURCE_POSTGRES_OUTCOME: ${{ steps.source_postgres.outcome }}
          MERGE_POSTGRES_OUTCOME: ${{ steps.merge_postgres.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-postgres
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path('run/world-authority-postgres')

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args], check=True, text=True, stdout=subprocess.PIPE
              ).stdout.strip()

          def git_at(revision: str, path: str):
              if not revision:
                  return None
              return git('rev-parse', f'{revision}:{path}')

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          outcomes = {
              'source_head': os.environ.get('SOURCE_POSTGRES_OUTCOME', 'skipped'),
              'prospective_merge': os.environ.get('MERGE_POSTGRES_OUTCOME', 'skipped'),
          }
          green = all(value == 'success' for value in outcomes.values())
          source = os.environ['SOURCE_HEAD_SHA']
          merge = os.environ.get('PROSPECTIVE_MERGE_COMMIT', '')
          evidence = {
              'schema': 'trillionnium.world.postgres-cutover-source-merge.v4',
              'status': 'source_and_prospective_merge_qualified' if green else 'failed_or_incomplete',
              'outcomes': outcomes,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_head_sha': source,
              'source_head_tree': os.environ.get('SOURCE_TREE'),
              'base_sha': os.environ.get('BASE_SHA'),
              'base_tree': os.environ.get('BASE_TREE'),
              'prospective_merge_commit': merge,
              'prospective_merge_tree': os.environ.get('PROSPECTIVE_MERGE_TREE'),
              'source_blobs': {
                  'base_migration': git_at(source, 'deploy/postgres/trnm-world-authority-cutover-v1.sql'),
                  'hardening_migration': git_at(source, 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'),
                  'installer': git_at(source, 'scripts/apply-trnm-world-authority-cutover-v1.sh'),
                  'state_checker': git_at(source, 'scripts/check-trnm-world-authority-postgres.sh'),
                  'installation_checker': git_at(source, 'scripts/check-trnm-world-authority-postgres-installation.sh'),
                  'psql_adapter': git_at(source, 'scripts/run-trnm-world-authority-postgres-check.sh'),
              },
              'prospective_merge_blobs': {
                  'base_migration': git_at(merge, 'deploy/postgres/trnm-world-authority-cutover-v1.sql'),
                  'hardening_migration': git_at(merge, 'deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql'),
                  'installer': git_at(merge, 'scripts/apply-trnm-world-authority-cutover-v1.sh'),
                  'state_checker': git_at(merge, 'scripts/check-trnm-world-authority-postgres.sh'),
                  'installation_checker': git_at(merge, 'scripts/check-trnm-world-authority-postgres-installation.sh'),
                  'psql_adapter': git_at(merge, 'scripts/run-trnm-world-authority-postgres-check.sh'),
              },
              'postgres_service_image': os.environ['POSTGRES_IMAGE_REF'],
              'postgres_service_digest': os.environ['POSTGRES_IMAGE_DIGEST'],
              'postgres_client_image': os.environ['TRNM_WORLD_POSTGRES_CLIENT_IMAGE'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'production_authorization': 'not_granted',
          }
          (out / 'exact-sha-identity.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          files = sorted(
              path for path in out.rglob('*')
              if path.is_file() and path.name != 'artifact-manifest.json'
          )
          manifest = {
              'schema': 'trillionnium.world.postgres-cutover-artifact-manifest.v4',
              'status': evidence['status'],
              'source_head_sha': source,
              'prospective_merge_commit': merge,
              'postgres_service_digest': os.environ['POSTGRES_IMAGE_DIGEST'],
              'files': [
                  {
                      'path': path.relative_to(out).as_posix(),
                      'bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  }
                  for path in files
              ],
          }
          (out / 'artifact-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload qualified PostgreSQL evidence
        if: ${{ always() && steps.source_postgres.outcome == 'success' && steps.merge_postgres.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-postgres-qualified-${{ env.SOURCE_HEAD_SHA }}-${{ steps.identity.outputs.prospective_merge_commit }}
          path: run/world-authority-postgres/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload unqualified PostgreSQL evidence
        if: ${{ always() && (steps.source_postgres.outcome != 'success' || steps.merge_postgres.outcome != 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-postgres-unqualified-${{ env.SOURCE_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/world-authority-postgres/**
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source and prospective-merge qualification
        if: always()
        shell: bash
        env:
          SOURCE_POSTGRES_OUTCOME: ${{ steps.source_postgres.outcome }}
          MERGE_POSTGRES_OUTCOME: ${{ steps.merge_postgres.outcome }}
        run: |
          set -euo pipefail
          test "$SOURCE_POSTGRES_OUTCOME" = success
          test "$MERGE_POSTGRES_OUTCOME" = success
