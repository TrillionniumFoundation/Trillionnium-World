name: trnm-game-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'trillionnium/deny.toml'
      - 'trillionnium/crates/trnm-*/**'
      - 'trillionnium/crates/world-authority/**'
      - 'assets/first_contact/**'
      - 'deploy/systemd/trnm-*.service'
      - 'scripts/check-trnm-online-*.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'scripts/check-trnm-world-authority-provenance.py'
      - 'scripts/run-trnm-*.sh'
      - 'scripts/install-trnm-game-server-systemd.sh'
      - 'scripts/package-trnm-game-release.sh'
      - 'scripts/check-trnm-game-package.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - 'docs/contracts/trillionnium-world-authority-provenance-v1.json'
      - 'packaging/**'
      - 'GAME_STATUS.md'
      - '.github/workflows/trnm-game-ci.yml'
      - '.github/workflows/trnm-world-authority-cutover.yml'
  push:
    branches: [main, 'feat/p0-world-authority-cutover-*']
    paths:
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'trillionnium/deny.toml'
      - 'trillionnium/crates/trnm-*/**'
      - 'trillionnium/crates/world-authority/**'
      - 'assets/first_contact/**'
      - 'deploy/systemd/trnm-*.service'
      - 'scripts/check-trnm-online-*.sh'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'scripts/check-trnm-world-authority-provenance.py'
      - 'scripts/run-trnm-*.sh'
      - 'scripts/install-trnm-game-server-systemd.sh'
      - 'scripts/package-trnm-game-release.sh'
      - 'scripts/check-trnm-game-package.sh'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - 'docs/contracts/trillionnium-world-authority-provenance-v1.json'
      - 'packaging/**'
      - 'GAME_STATUS.md'
      - '.github/workflows/trnm-game-ci.yml'
      - '.github/workflows/trnm-world-authority-cutover.yml'

permissions:
  contents: read

concurrency:
  group: trnm-game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONUTF8: '1'
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_AUDIT_VERSION: '0.22.2'
  CARGO_DENY_VERSION: '0.20.2'
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  RUST_TOOLCHAIN_ACTION_SHA: 6bed0761d98439e5a578e2877258200ad565ba87
  INSTALL_ACTION_SHA: 44c6d64aa62cd779e873306675c7a58e86d6d532
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  game-workspace:
    name: trnm-game-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source and prospective merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          if [[ -n "$BASE_SHA" ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            merge_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
            merge_tree="$(printf '%s\n' "$merge_output" | head -n1)"
            [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='Trillionnium game qualification'
            export GIT_AUTHOR_EMAIL='qualification@trillionnium.invalid'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            merge_commit="$(
              printf 'Synthetic prospective merge for game qualification only\n' \
                | git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA"
            )"
          else
            merge_tree="$source_tree"
            merge_commit="$SOURCE_HEAD_SHA"
          fi
          {
            echo "source_tree=$source_tree"
            echo "merge_tree=$merge_tree"
            echo "merge_commit=$merge_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Install immutable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          mkdir -p ../run/ci-game-identities
          rustc --version --verbose > ../run/ci-game-identities/rustc-version.txt
          cargo --version --verbose > ../run/ci-game-identities/cargo-version.txt
          rustfmt --version > ../run/ci-game-identities/rustfmt-version.txt
          cargo clippy --version > ../run/ci-game-identities/clippy-version.txt

      - name: Install native build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Validate exact source authority boundary
        id: source_authority
        if: ${{ hashFiles('trillionnium/crates/world-authority/Cargo.toml') != '' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-source-target
        run: ../scripts/check-trnm-world-authority-cutover.sh

      - name: Validate exact source game workspace
        id: source_workspace
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-source-target
        run: |
          set -euo pipefail
          ../scripts/check-trnm-online-resource-budgets.sh
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p trnm-first-contact -p trnm-game-server --bins

      - name: Package and verify exact source Linux distribution
        id: source_package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-source-target
        run: |
          set -euo pipefail
          ../scripts/package-trnm-game-release.sh --require-clean --output-dir ../run/ci-distribution/source
          archive="$(find ../run/ci-distribution/source -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          TRNM_REQUIRE_CLEAN_PACKAGE=1 ../scripts/check-trnm-game-package.sh "$archive"

      - name: Validate prospective merge game and authority workspace
        id: merge_workspace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_COMMIT: ${{ steps.identity.outputs.merge_commit }}
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-merge-target
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/trnm-game-prospective-merge"
          git worktree add --detach "$worktree" "$MERGE_COMMIT"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse HEAD^{tree})" = "$MERGE_TREE"
          bash "$worktree/scripts/check-trnm-world-authority-cutover.sh"
          (
            cd "$worktree/trillionnium"
            ../scripts/check-trnm-online-resource-budgets.sh
            cargo fmt --all -- --check
            cargo test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo build --release --locked -p trnm-first-contact -p trnm-game-server --bins
            ../scripts/package-trnm-game-release.sh --require-clean --output-dir "$RUNNER_TEMP/trnm-merge-distribution"
            archive="$(find "$RUNNER_TEMP/trnm-merge-distribution" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
            test -n "$archive"
            TRNM_REQUIRE_CLEAN_PACKAGE=1 ../scripts/check-trnm-game-package.sh "$archive"
          )
          mkdir -p ../run/ci-distribution/merge
          cp "$RUNNER_TEMP"/trnm-merge-distribution/* ../run/ci-distribution/merge/

      - name: Record fail-closed source and merge evidence
        id: evidence
        if: always()
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
          MERGE_COMMIT: ${{ steps.identity.outputs.merge_commit }}
          WORLD_AUTHORITY_PRESENT: ${{ hashFiles('trillionnium/crates/world-authority/Cargo.toml') != '' }}
          SOURCE_AUTHORITY_CONCLUSION: ${{ steps.source_authority.conclusion }}
          SOURCE_WORKSPACE_CONCLUSION: ${{ steps.source_workspace.conclusion }}
          SOURCE_PACKAGE_CONCLUSION: ${{ steps.source_package.conclusion }}
          MERGE_WORKSPACE_CONCLUSION: ${{ steps.merge_workspace.conclusion }}
          JOB_STATUS_AT_EVIDENCE: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p ../run/ci-game-identities
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path('..')
          out = root / 'run/ci-game-identities'

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args],
                  cwd=root,
                  check=True,
                  text=True,
                  encoding='utf-8',
                  errors='strict',
                  stdout=subprocess.PIPE,
              ).stdout.strip()

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          event_name = os.environ['GITHUB_EVENT_NAME']
          world_authority_present = os.environ['WORLD_AUTHORITY_PRESENT'].lower() == 'true'
          gate_conclusions = {
              'source_authority': os.environ.get('SOURCE_AUTHORITY_CONCLUSION', ''),
              'source_workspace': os.environ.get('SOURCE_WORKSPACE_CONCLUSION', ''),
              'source_package': os.environ.get('SOURCE_PACKAGE_CONCLUSION', ''),
              'prospective_merge_workspace': os.environ.get('MERGE_WORKSPACE_CONCLUSION', ''),
          }
          required_gates = ['source_workspace', 'source_package']
          if world_authority_present:
              required_gates.append('source_authority')
          if event_name == 'pull_request':
              required_gates.append('prospective_merge_workspace')

          qualified = all(gate_conclusions.get(name) == 'success' for name in required_gates)
          required_results = [gate_conclusions.get(name, '') for name in required_gates]
          if qualified:
              status = (
                  'source_and_prospective_merge_qualified'
                  if event_name == 'pull_request'
                  else 'source_qualified'
              )
          elif any(value == 'cancelled' for value in required_results):
              status = 'qualification_cancelled'
          elif any(value == 'failure' for value in required_results):
              status = 'qualification_failed'
          else:
              status = 'qualification_incomplete'

          summary = {
              'schema': 'trillionnium.game-ci.evidence.v2',
              'evidence_semantics': 'fail_closed_required_gate_conclusions',
              'status': status,
              'qualified': qualified,
              'gate_conclusions': gate_conclusions,
              'required_gates': required_gates,
              'job_status_at_evidence': os.environ.get('JOB_STATUS_AT_EVIDENCE'),
              'world_authority_present': world_authority_present,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': event_name,
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': os.environ.get('SOURCE_TREE') or None,
              'base_sha': os.environ.get('BASE_SHA') or None,
              'prospective_merge_tree': os.environ.get('MERGE_TREE') or None,
              'prospective_merge_commit': os.environ.get('MERGE_COMMIT') or None,
              'trigger_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'workflow_blob_sha': git('rev-parse', 'HEAD:.github/workflows/trnm-game-ci.yml'),
              'actions': {
                  'actions/checkout': os.environ['CHECKOUT_ACTION_SHA'],
                  'dtolnay/rust-toolchain': os.environ['RUST_TOOLCHAIN_ACTION_SHA'],
                  'actions/upload-artifact': os.environ['UPLOAD_ARTIFACT_ACTION_SHA'],
              },
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          files = sorted(
              path for path in out.iterdir()
              if path.is_file() and path.name != 'manifest.json'
          )
          manifest = {
              'schema': 'trillionnium.game-ci.artifact-manifest.v2',
              'status': status,
              'qualified': qualified,
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'gate_conclusions': gate_conclusions,
              'required_gates': required_gates,
              'files': [
                  {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha256(path)}
                  for path in files
              ],
          }
          (out / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"qualified={'true' if qualified else 'false'}\n")
              handle.write(f"status={status}\n")
          PY

      - name: Upload qualified game distributions and evidence
        if: ${{ always() && steps.evidence.outputs.qualified == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-game-qualified-${{ env.SOURCE_HEAD_SHA }}
          path: |
            run/ci-distribution/**
            run/ci-game-identities/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload unqualified game evidence
        if: ${{ always() && steps.evidence.outputs.qualified != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-game-unqualified-${{ env.SOURCE_HEAD_SHA }}
          path: run/ci-game-identities/**
          if-no-files-found: error
          retention-days: 90

  supply-chain:
    name: trnm-game-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install immutable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Verify immutable tool identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          cargo audit --version | tee ../run-cargo-audit-version.txt
          cargo deny --version | tee ../run-cargo-deny-version.txt
          grep -F "cargo-audit $CARGO_AUDIT_VERSION" ../run-cargo-audit-version.txt
          grep -F "cargo-deny $CARGO_DENY_VERSION" ../run-cargo-deny-version.txt

      - name: Resolve prospective merge identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          if [[ -n "$BASE_SHA" ]]; then
            merge_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
            merge_tree="$(printf '%s\n' "$merge_output" | head -n1)"
            [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='Trillionnium supply qualification'
            export GIT_AUTHOR_EMAIL='qualification@trillionnium.invalid'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            merge_commit="$(
              printf 'Synthetic prospective merge for supply qualification only\n' \
                | git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA"
            )"
          else
            merge_tree="$(git rev-parse HEAD^{tree})"
            merge_commit="$SOURCE_HEAD_SHA"
          fi
          {
            echo "merge_tree=$merge_tree"
            echo "merge_commit=$merge_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Exact source RustSec advisory and dependency policy gates
        id: source_supply_chain
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --deny warnings --ignore RUSTSEC-2026-0192
          cargo deny check advisories bans licenses sources

      - name: Prospective merge RustSec advisory and dependency policy gates
        id: merge_supply_chain
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_COMMIT: ${{ steps.identity.outputs.merge_commit }}
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/trnm-supply-prospective-merge"
          git worktree add --detach "$worktree" "$MERGE_COMMIT"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse HEAD^{tree})" = "$MERGE_TREE"
          (
            cd "$worktree/trillionnium"
            cargo audit --deny warnings --ignore RUSTSEC-2026-0192
            cargo deny check advisories bans licenses sources
          )

      - name: Preserve fail-closed supply-chain reports
        id: supply_evidence
        if: always()
        shell: bash
        env:
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
          SOURCE_SUPPLY_CHAIN_CONCLUSION: ${{ steps.source_supply_chain.conclusion }}
          MERGE_SUPPLY_CHAIN_CONCLUSION: ${{ steps.merge_supply_chain.conclusion }}
          JOB_STATUS_AT_EVIDENCE: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p ../run/ci-supply-chain
          if [[ -f ../run-cargo-audit-version.txt ]]; then
            mv ../run-cargo-audit-version.txt ../run/ci-supply-chain/cargo-audit-version.txt
          fi
          if [[ -f ../run-cargo-deny-version.txt ]]; then
            mv ../run-cargo-deny-version.txt ../run/ci-supply-chain/cargo-deny-version.txt
          fi
          cargo audit --json --ignore RUSTSEC-2026-0192 > ../run/ci-supply-chain/cargo-audit.json || true
          cargo deny --format json check advisories bans licenses sources > ../run/ci-supply-chain/cargo-deny.json || true
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path('..')
          out = root / 'run/ci-supply-chain'

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args],
                  cwd=root,
                  check=True,
                  text=True,
                  encoding='utf-8',
                  errors='strict',
                  stdout=subprocess.PIPE,
              ).stdout.strip()

          event_name = os.environ['GITHUB_EVENT_NAME']
          gate_conclusions = {
              'source_supply_chain': os.environ.get('SOURCE_SUPPLY_CHAIN_CONCLUSION', ''),
              'prospective_merge_supply_chain': os.environ.get('MERGE_SUPPLY_CHAIN_CONCLUSION', ''),
          }
          required_gates = ['source_supply_chain']
          if event_name == 'pull_request':
              required_gates.append('prospective_merge_supply_chain')
          qualified = all(gate_conclusions.get(name) == 'success' for name in required_gates)
          required_results = [gate_conclusions.get(name, '') for name in required_gates]
          if qualified:
              status = (
                  'source_and_prospective_merge_supply_chain_qualified'
                  if event_name == 'pull_request'
                  else 'source_supply_chain_qualified'
              )
          elif any(value == 'cancelled' for value in required_results):
              status = 'supply_chain_qualification_cancelled'
          elif any(value == 'failure' for value in required_results):
              status = 'supply_chain_qualification_failed'
          else:
              status = 'supply_chain_qualification_incomplete'

          summary = {
              'schema': 'trillionnium.game-supply-chain.evidence.v2',
              'evidence_semantics': 'fail_closed_required_gate_conclusions',
              'status': status,
              'qualified': qualified,
              'gate_conclusions': gate_conclusions,
              'required_gates': required_gates,
              'job_status_at_evidence': os.environ.get('JOB_STATUS_AT_EVIDENCE'),
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': git('rev-parse', 'HEAD^{tree}'),
              'base_sha': os.environ.get('BASE_SHA') or None,
              'prospective_merge_tree': os.environ.get('MERGE_TREE') or None,
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'cargo_audit_version': os.environ['CARGO_AUDIT_VERSION'],
              'cargo_deny_version': os.environ['CARGO_DENY_VERSION'],
              'actions': {
                  'actions/checkout': os.environ['CHECKOUT_ACTION_SHA'],
                  'dtolnay/rust-toolchain': os.environ['RUST_TOOLCHAIN_ACTION_SHA'],
                  'taiki-e/install-action': os.environ['INSTALL_ACTION_SHA'],
                  'actions/upload-artifact': os.environ['UPLOAD_ARTIFACT_ACTION_SHA'],
              },
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          files = sorted(
              path for path in out.iterdir()
              if path.is_file() and path.name != 'manifest.json'
          )
          manifest = {
              'schema': 'trillionnium.game-supply-chain.artifact-manifest.v2',
              'status': status,
              'qualified': qualified,
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'gate_conclusions': gate_conclusions,
              'required_gates': required_gates,
              'files': [
                  {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha256(path)}
                  for path in files
              ],
          }
          (out / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"qualified={'true' if qualified else 'false'}\n")
              handle.write(f"status={status}\n")
          PY

      - name: Upload qualified supply-chain evidence
        if: ${{ always() && steps.supply_evidence.outputs.qualified == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-supply-chain-qualified-${{ env.SOURCE_HEAD_SHA }}
          path: run/ci-supply-chain/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload unqualified supply-chain evidence
        if: ${{ always() && steps.supply_evidence.outputs.qualified != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-supply-chain-unqualified-${{ env.SOURCE_HEAD_SHA }}
          path: run/ci-supply-chain/**
          if-no-files-found: error
          retention-days: 90
