name: trnm-game-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PROJECT_BOUNDARY.md'
      - 'PROJECT_BOUNDARY.json'
      - 'CURRENT_PLAN.md'
      - 'docs/**'
      - 'config/trnm-*.env.example'
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'trillionnium/deny.toml'
      - 'trillionnium/crates/trnm-*/**'
      - 'trillionnium/tools/trnm-settlement-outbox-contract/**'
      - 'assets/first_contact/**'
      - 'deploy/systemd/trnm-*.service'
      - 'scripts/check-trnm-online-*.sh'
      - 'scripts/check_trnm_*.sh'
      - 'scripts/run-trnm-*.sh'
      - 'scripts/install-trnm-game-server-systemd.sh'
      - 'scripts/package-trnm-game-release.sh'
      - 'scripts/check-trnm-game-package.sh'
      - 'packaging/**'
      - 'GAME_STATUS.md'
      - '.github/workflows/trnm-game-ci.yml'
  push:
    branches: [main]
    paths:
      - 'PROJECT_BOUNDARY.md'
      - 'PROJECT_BOUNDARY.json'
      - 'CURRENT_PLAN.md'
      - 'docs/**'
      - 'config/trnm-*.env.example'
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'trillionnium/deny.toml'
      - 'trillionnium/crates/trnm-*/**'
      - 'trillionnium/tools/trnm-settlement-outbox-contract/**'
      - 'assets/first_contact/**'
      - 'deploy/systemd/trnm-*.service'
      - 'scripts/check-trnm-online-*.sh'
      - 'scripts/check_trnm_*.sh'
      - 'scripts/run-trnm-*.sh'
      - 'scripts/install-trnm-game-server-systemd.sh'
      - 'scripts/package-trnm-game-release.sh'
      - 'scripts/check-trnm-game-package.sh'
      - 'packaging/**'
      - 'GAME_STATUS.md'
      - '.github/workflows/trnm-game-ci.yml'

permissions:
  contents: read

concurrency:
  group: trnm-game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'

jobs:
  architecture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install boundary-check dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: Authority ownership boundary
        run: ./scripts/check_trnm_authority_boundary.sh
      - name: Runtime configuration boundary
        run: ./scripts/check_trnm_runtime_configuration.sh
      - name: Settlement outbox invariant contract
        run: ./scripts/check_trnm_settlement_outbox_contract.sh
      - name: Settlement transaction migration-debt boundary
        run: ./scripts/check_trnm_settlement_transaction_boundary.sh

  game-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Product workspace and repository boundary
        run: ../scripts/check_trnm_game_product.sh
      - name: Authority ownership boundary
        run: ../scripts/check_trnm_authority_boundary.sh
      - name: Runtime configuration boundary
        run: ../scripts/check_trnm_runtime_configuration.sh
      - name: Settlement transaction migration-debt boundary
        run: ../scripts/check_trnm_settlement_transaction_boundary.sh
      - name: Resource budget contract
        run: ../scripts/check-trnm-online-resource-budgets.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release player and online compatibility services
        run: cargo build --release --locked -p trnm-first-contact -p trnm-game-server --bins
      - name: Package complete Linux distribution
        run: ../scripts/package-trnm-game-release.sh --require-clean --output-dir ../run/ci-distribution
      - name: Verify Linux distribution
        run: |
          archive="$(find ../run/ci-distribution -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          TRNM_REQUIRE_CLEAN_PACKAGE=1 ../scripts/check-trnm-game-package.sh "$archive"
      - name: Upload complete release artifact
        uses: actions/upload-artifact@v4
        with:
          name: trnm-game-${{ github.sha }}
          path: run/ci-distribution/**
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: RustSec advisory gate
        # Current Bevy/winit has no maintained replacement for ttf-parser;
        # every vulnerability and unsoundness advisory remains denied.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0192
      - name: Dependency policy gate
        run: cargo deny check advisories bans licenses sources
      - name: Preserve supply-chain reports
        if: always()
        run: |
          mkdir -p ../run/ci-supply-chain
          cargo audit --json --ignore RUSTSEC-2026-0192 > ../run/ci-supply-chain/cargo-audit.json || true
          cargo deny --format json check advisories bans licenses sources > ../run/ci-supply-chain/cargo-deny.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trnm-supply-chain-${{ github.sha }}
          path: run/ci-supply-chain/**
          if-no-files-found: error
