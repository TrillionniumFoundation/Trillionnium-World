name: trnm-world-development-closure-probe

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-development-closure-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prove immutable clean identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse 'HEAD^{tree}'
          test -z "$(git status --porcelain)"
