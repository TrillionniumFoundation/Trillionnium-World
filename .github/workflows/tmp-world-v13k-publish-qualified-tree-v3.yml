name: tmp-world-v13k-publish-qualified-tree-v3

on:
  push:
    branches:
      - chore/world-object-import-v13k-20260901
    paths:
      - .github/workflows/tmp-world-v13k-publish-qualified-tree-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-world-v13k-publish-qualified-tree-v3
  cancel-in-progress: false

jobs:
  qualify-and-fast-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_TOOLCHAIN: "1.98.0"
      SOURCE_WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
      CONTROL_HEAD: "68e9631b3fc3f75f332497f8d0551608bf0e1413"
      EXPECTED_PATCH_SHA256: "ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f"
      EXPECTED_QUALIFIED_TREE: "5e613185f5a2abda42df371f3755e73667717309"
      TARGET_BRANCH: "fix/world-plan-v4-development-closure-20260831"
      EXPECTED_TARGET_HEAD: "40180fa6f5437e8f112372aaba992db8ff646b73"
      REPOSITORY: "TrillionniumFoundation/Trillionnium-World"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "0"

    steps:
      - name: Reconstruct and qualify exact immutable candidate
        shell: bash
        run: |
          set -euo pipefail

          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          patch_sha="$(sha256sum export/world-v13-source.patch | awk '{print $1}')"
          test "$patch_sha" = "${EXPECTED_PATCH_SHA256}"
          git -C candidate add -A
          candidate_tree="$(git -C candidate write-tree)"
          test "$candidate_tree" = "${EXPECTED_QUALIFIED_TREE}"
          test ! -e candidate/trillionnium/crates/trnm-game-server/build.rs
          test ! -e candidate/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' candidate/trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' candidate/trillionnium/crates/trnm-game-server
          printf 'TRNM_WORLD_QUALIFIED_TREE=%s\n' "$candidate_tree"
          printf 'TRNM_WORLD_QUALIFICATION=PASS\n'

      - name: Create exact Git objects and fast-forward target ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_head = os.environ["SOURCE_WORLD_HEAD"]
          target_branch = os.environ["TARGET_BRANCH"]
          expected_target_head = os.environ["EXPECTED_TARGET_HEAD"]
          expected_tree = os.environ["EXPECTED_QUALIFIED_TREE"]
          root = Path("candidate")

          def api(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trnm-world-qualified-tree-publisher-v3",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: {error.code}: {body}")

          encoded_branch = urllib.parse.quote(target_branch, safe="")
          observed = api("GET", f"/repos/{repository}/branches/{encoded_branch}")
          observed_head = observed["commit"]["sha"]
          if observed_head != expected_target_head:
              raise SystemExit(
                  f"target branch moved: expected={expected_target_head} observed={observed_head}"
              )

          source_commit = api("GET", f"/repos/{repository}/git/commits/{source_head}")
          source_tree = source_commit["tree"]["sha"]
          raw_paths = subprocess.check_output(
              ["git", "-C", str(root), "diff", "--cached", "--name-only", "-z"]
          )
          paths = [item.decode("utf-8") for item in raw_paths.split(b"\0") if item]
          if len(paths) < 50:
              raise SystemExit(f"refusing undersized source candidate: {len(paths)} paths")

          entries = []
          for relative in paths:
              path = root / relative
              if not path.exists():
                  entries.append({"path": relative, "mode": "100644", "type": "blob", "sha": None})
                  continue
              if not path.is_file():
                  raise SystemExit(f"unsupported non-file path: {relative}")
              index_line = subprocess.check_output(
                  ["git", "-C", str(root), "ls-files", "-s", "--", relative],
                  text=True,
              ).strip()
              mode = index_line.split(None, 1)[0]
              if mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported mode {mode}: {relative}")
              blob = api(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {
                      "content": base64.b64encode(path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})

          tree = api(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": source_tree, "tree": entries},
          )
          if tree["sha"] != expected_tree:
              raise SystemExit(
                  f"server tree mismatch: expected={expected_tree} observed={tree['sha']}"
              )

          observed_again = api("GET", f"/repos/{repository}/branches/{encoded_branch}")
          if observed_again["commit"]["sha"] != expected_target_head:
              raise SystemExit("target branch moved during object import")

          commit = api(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "fix(world): publish exact qualified Plan V4 direct-source tree\n\nSource-World-Head: 5605cfb8861aa923f69ff032ddbff7d035bccb0c\nQualification-Control-Head: 68e9631b3fc3f75f332497f8d0551608bf0e1413\nQualified-Tree: 5e613185f5a2abda42df371f3755e73667717309\nPatch-SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f\n",
                  "tree": expected_tree,
                  "parents": [expected_target_head],
              },
          )
          api(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{target_branch}",
              {"sha": commit["sha"], "force": False},
          )

          final = api("GET", f"/repos/{repository}/git/commits/{commit['sha']}")
          if final["tree"]["sha"] != expected_tree:
              raise SystemExit("published commit tree failed read-back")
          branch = api("GET", f"/repos/{repository}/branches/{encoded_branch}")
          if branch["commit"]["sha"] != commit["sha"]:
              raise SystemExit("published ref failed read-back")
          print(f"TRNM_WORLD_PUBLISHED_HEAD={commit['sha']}")
          print(f"TRNM_WORLD_PUBLISHED_TREE={expected_tree}")
          print("TRNM_WORLD_FAST_FORWARD_PUBLISH=PASS")
          PY
