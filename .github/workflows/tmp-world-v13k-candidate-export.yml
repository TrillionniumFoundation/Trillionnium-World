name: tmp-world-v13k-candidate-export

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
    paths:
      - .github/workflows/tmp-world-v13k-candidate-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Rebuild and qualify exact World v13k candidate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
          RUST_TOOLCHAIN: "1.98.0"
          WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
          CONTROL_HEAD: "917db5b73fb5a1ae19682709bdcfd7194852d99a"
          EXPECTED_PATCH_SHA256: "ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f"
          EXPECTED_TREE: "5e613185f5a2abda42df371f3755e73667717309"
        run: |
          set -euo pipefail

          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "$CONTROL_HEAD"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "$CONTROL_HEAD"

          git init world
          git -C world remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C world fetch --no-tags --depth=1 origin "$WORLD_HEAD"
          git -C world checkout --detach FETCH_HEAD
          test "$(git -C world rev-parse HEAD)" = "$WORLD_HEAD"

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version --verbose

          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/world" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          patch_sha="$(sha256sum "$GITHUB_WORKSPACE/export/world-v13-source.patch" | awk '{print $1}')"
          test "$patch_sha" = "$EXPECTED_PATCH_SHA256"

          git -C "$GITHUB_WORKSPACE/world" add -A
          candidate_tree="$(git -C "$GITHUB_WORKSPACE/world" write-tree)"
          test "$candidate_tree" = "$EXPECTED_TREE"

          tree_archive="$GITHUB_WORKSPACE/export/world-v13k-candidate-tree.tar.gz"
          git -C "$GITHUB_WORKSPACE/world" archive --format=tar "$candidate_tree" \
            | gzip -n -9 > "$tree_archive"
          test -s "$tree_archive"
          archive_sha="$(sha256sum "$tree_archive" | awk '{print $1}')"
          printf '%s  %s\n' "$archive_sha" "$(basename "$tree_archive")" \
            >> "$GITHUB_WORKSPACE/export/SHA256SUMS"

          printf 'qualified_patch_sha256=%s\n' "$patch_sha"
          printf 'qualified_candidate_tree=%s\n' "$candidate_tree"
          printf 'qualified_candidate_tree_archive_sha256=%s\n' "$archive_sha"
          printf 'TRNM_WORLD_V13K_EXACT_STAGING_QUALIFICATION=PASS\n'

      - name: Upload immutable World v13k evidence with pinned GitHub bundle
        shell: bash
        env:
          INPUT_NAME: world-v13k-source-candidate-${{ github.sha }}
          INPUT_PATH: ${{ github.workspace }}/export
          'INPUT_IF-NO-FILES-FOUND': error
          INPUT_OVERWRITE: "false"
          'INPUT_INCLUDE-HIDDEN-FILES': "false"
          'INPUT_RETENTION-DAYS': "30"
          'INPUT_COMPRESSION-LEVEL': "9"
        run: |
          set -euo pipefail
          uploader="$RUNNER_TEMP/trnm-upload-artifact-v4.6.2.js"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 \
            "https://raw.githubusercontent.com/actions/upload-artifact/ea165f8d65b6e75b540449e92b4886f43607fa02/dist/upload/index.js" \
            --output "$uploader"
          test "$(git hash-object "$uploader")" = 89238fa3eb49937ea82c5d82006ee1fc6c6abaae
          node "$uploader"
          printf 'TRNM_WORLD_V13K_IMMUTABLE_ARTIFACT=PASS\n'
