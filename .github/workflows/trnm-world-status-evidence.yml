name: trnm-world-status-evidence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - fix/world-plan-v4-source-gap-closure

permissions:
  contents: read

concurrency:
  group: trnm-world-status-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-status:
    name: trnm-world-status-evidence/validate-status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse machine-readable truth
        run: |
          python3 -m py_compile scripts/check-trnm-world-plan-v4.py
          python3 -m json.tool PROJECT_BOUNDARY.json > /dev/null
          python3 -m json.tool docs/development/trillionnium-world-development-plan-v4-2026-08-29.json > /dev/null
          python3 -m json.tool docs/status/world-gap-registry-v2.json > /dev/null
          python3 -m json.tool docs/status/world-gap-registry-v2.schema.json > /dev/null
      - name: Validate current plan and gap registry
        run: python3 scripts/check-trnm-world-plan-v4.py
      - name: Enforce read-only review integrity
        run: bash scripts/check-trnm-review-integrity.sh
