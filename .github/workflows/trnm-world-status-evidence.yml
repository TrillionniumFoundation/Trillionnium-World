name: trnm-world-status-evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/status/**'
      - 'docs/development/trnm-world-development-plan-v3.md'
      - 'scripts/check-trnm-world-gates.py'
      - 'scripts/test-trnm-world-gates-negative.py'
      - 'scripts/render-trnm-world-status.py'
      - '.github/workflows/trnm-world-status-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docs/status/**'
      - 'docs/development/trnm-world-development-plan-v3.md'
      - 'scripts/check-trnm-world-gates.py'
      - 'scripts/test-trnm-world-gates-negative.py'
      - 'scripts/render-trnm-world-status.py'
      - '.github/workflows/trnm-world-status-evidence.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-status-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate gate registry
        run: python3 scripts/check-trnm-world-gates.py
      - name: Prove gate registry fails closed on tampering
        run: python3 scripts/test-trnm-world-gates-negative.py
      - name: Verify generated current status
        run: python3 scripts/render-trnm-world-status.py --check
