name: trnm-world-p0-boundaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - fix/world-plan-v4-source-gap-closure

permissions:
  contents: read

concurrency:
  group: trnm-world-p0-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  TRNM_RUST_TOOLCHAIN: '1.98.0'

jobs:
  authority-boundary:
    name: trnm-world-p0-boundaries/authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify World/Nakama authority ownership boundary
        run: bash scripts/check-trnm-world-authority-boundary.sh
      - name: Prove forbidden authority fixtures fail closed
        run: bash scripts/test-trnm-world-authority-boundary-negative.sh
      - name: Enforce review integrity
        run: bash scripts/check-trnm-review-integrity.sh

  settlement-transaction-boundary:
    name: trnm-world-p0-boundaries/settlement-transaction-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify external work is outside mutable transactions
        run: bash scripts/check-trnm-settlement-transaction-boundary.sh
      - name: Prove transaction-spanning I/O fails closed
        run: bash scripts/test-trnm-settlement-transaction-boundary-negative.sh
      - name: Validate launcher shell syntax
        run: bash -n scripts/run-trnm-settlement-worker.sh scripts/install-trnm-game-server-systemd.sh

  settlement-worker-rust:
    name: trnm-world-p0-boundaries/settlement-worker-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$TRNM_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TRNM_RUST_TOOLCHAIN"
      - name: Resolve locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test settlement worker target
        run: cargo test --locked -p trnm-game-server --bin trnm-settlement-worker
      - name: Test settlement source and SQL contracts
        run: cargo test --locked -p trnm-game-server --test settlement_worker_contract
      - name: Strict lint
        run: cargo clippy --locked -p trnm-game-server --bin trnm-settlement-worker -- -D warnings
