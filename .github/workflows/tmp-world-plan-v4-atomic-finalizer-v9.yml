name: tmp-world-plan-v4-atomic-finalizer-v9

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-atomic-finalizer-v9.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: tmp-world-plan-v4-atomic-finalizer-v9
  cancel-in-progress: false

env:
  REPOSITORY: TrillionniumFoundation/Trillionnium-World
  TARGET_BRANCH: fix/world-plan-v4-development-closure-20260831
  SOURCE_WORLD_HEAD: 5605cfb8861aa923f69ff032ddbff7d035bccb0c
  CONTROL_HEAD: 68e9631b3fc3f75f332497f8d0551608bf0e1413
  EXPECTED_PATCH_SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f
  EXPECTED_QUALIFIED_TREE: 5e613185f5a2abda42df371f3755e73667717309
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  finalize:
    name: atomic-qualified-source-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: trnm
          POSTGRES_PASSWORD: trnm
          POSTGRES_DB: trnm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trnm -d trnm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_SHA: ${{ github.sha }}
      DATABASE_URL: postgres://trnm:trnm@127.0.0.1:5432/trnm
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "1"
    steps:
      - name: Reconstruct immutable qualified source
        shell: bash
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST=0 \
            bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
              "$GITHUB_WORKSPACE/candidate" \
              "$GITHUB_WORKSPACE/control" \
              "$GITHUB_WORKSPACE/export"
          test "$(sha256sum export/world-v13-source.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git -C candidate add -A
          test "$(git -C candidate write-tree)" = "${EXPECTED_QUALIFIED_TREE}"
          test ! -e candidate/trillionnium/crates/trnm-game-server/build.rs
          test ! -e candidate/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' candidate/trillionnium/crates/trnm-game-server
          ! grep -R --line-number --fixed-strings 'include!(concat!(env!("OUT_DIR")' candidate/trillionnium/crates/trnm-game-server
          printf 'TRNM_WORLD_V9_RECONSTRUCTION=PASS\n'

      - name: Publish exact source and clean governance tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; branch=os.environ['TARGET_BRANCH']
          bootstrap=os.environ['BOOTSTRAP_SHA']; source_head=os.environ['SOURCE_WORLD_HEAD']
          expected_tree=os.environ['EXPECTED_QUALIFIED_TREE']; root=Path('candidate')

          def api(method,path,payload=None,allow=()):
              data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers={
                  'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'trnm-world-plan-v4-finalizer-v9'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read(); return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  if e.code in allow: return {'http_status':e.code,'body':body}
                  raise SystemExit(f'{method} {path} failed {e.code}: {body}')

          encoded=urllib.parse.quote(branch,safe='')
          observed=api('GET',f'/repos/{repo}/branches/{encoded}')['commit']['sha']
          if observed!=bootstrap:
              raise SystemExit(f'branch ownership lost: expected={bootstrap} observed={observed}')

          source_base=api('GET',f'/repos/{repo}/git/commits/{source_head}')['tree']['sha']
          raw=subprocess.check_output(['git','-C',str(root),'diff','--cached','--name-only','-z'])
          paths=[x.decode() for x in raw.split(b'\0') if x]
          if len(paths)<50: raise SystemExit(f'undersized qualified inventory: {len(paths)}')
          entries=[]
          for rel in paths:
              p=root/rel
              if not p.exists():
                  entries.append({'path':rel,'mode':'100644','type':'blob','sha':None}); continue
              if not p.is_file(): raise SystemExit(f'unsupported path: {rel}')
              mode=subprocess.check_output(['git','-C',str(root),'ls-files','-s','--',rel],text=True).split()[0]
              if mode not in {'100644','100755'}: raise SystemExit(f'unsupported mode {mode}: {rel}')
              blob=api('POST',f'/repos/{repo}/git/blobs',{
                  'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':rel,'mode':mode,'type':'blob','sha':blob['sha']})
          source_tree=api('POST',f'/repos/{repo}/git/trees',{'base_tree':source_base,'tree':entries})['sha']
          if source_tree!=expected_tree: raise SystemExit(f'source tree mismatch: {source_tree}')

          source_commit=api('POST',f'/repos/{repo}/git/commits',{
              'message':'fix(world): publish exact qualified Plan V4 direct-source tree\n\nSource-World-Head: 5605cfb8861aa923f69ff032ddbff7d035bccb0c\nQualification-Control-Head: 68e9631b3fc3f75f332497f8d0551608bf0e1413\nQualified-Tree: 5e613185f5a2abda42df371f3755e73667717309\nPatch-SHA256: ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f\n',
              'tree':expected_tree,'parents':[bootstrap]})
          source_sha=source_commit['sha']

          codeowners='''# Trillionnium World independent ownership\n* @Tomasrgbsf @ProfHepta @Franksudoman\n\n/.github/workflows/ @ProfHepta @Franksudoman\n/.github/CODEOWNERS @ProfHepta @Franksudoman\n/CURRENT_PLAN.md @ProfHepta @Franksudoman\n/docs/adr/ @ProfHepta @Franksudoman\n/docs/protocol/ @ProfHepta @Franksudoman\n/docs/status/ @ProfHepta @Franksudoman\n/scripts/ @ProfHepta @Franksudoman\n/trillionnium/contracts/ @ProfHepta @Franksudoman\n/trillionnium/crates/trnm-campaign-core/ @ProfHepta @Franksudoman\n/trillionnium/crates/trnm-rts-sim/ @ProfHepta @Franksudoman\n/trillionnium/crates/trnm-game-server/ @ProfHepta @Franksudoman\n/trillionnium/crates/trnm-game-server/migrations/ @ProfHepta @Franksudoman\n'''
          ledger={
              'schema':'trnm_world_plan_v4_source_closure_v1',
              'plan':'trillionnium-world-development-2026-08-29-v4',
              'source_world_head':os.environ['SOURCE_WORLD_HEAD'],
              'qualification_control_head':os.environ['CONTROL_HEAD'],
              'qualification_run_id':33452853784,
              'qualification_artifact_id':9780499701,
              'qualification_artifact_digest':'sha256:456a181bdc8f8aa248229b044db9eec4f52572ea3b20bca6492907db58d64ef5',
              'patch_sha256':os.environ['EXPECTED_PATCH_SHA256'],
              'qualified_source_tree':expected_tree,
              'qualified_source_commit':source_sha,
              'rust_toolchain':os.environ['RUST_TOOLCHAIN'],
              'world_owned_source_development_closed':True,
              'repository_review_closed':False,
              'all_plan_gaps_closed':False,
              'external_evidence_gaps':{
                  'nakama_canonical_authority':'open',
                  'trusted_cex_custody_and_settlement':'open',
                  'deployment_and_public_edge':'open',
                  'cross_host_recovery_and_endurance':'open',
                  'human_and_accessibility_validation':'open',
                  'privacy_legal_support_and_commercial':'open'},
              'evidence_rule':'source and CI cannot satisfy deployment, custody, human, legal, or commercial evidence'}
          closure='''name: trnm-world-v4-closure-contract\n\non:\n  pull_request:\n  push:\n    branches: [main, fix/world-plan-v4-development-closure-20260831]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  closure-contract:\n    name: trnm-world-v4/closure-contract\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n      - name: Checkout exact commit\n        shell: bash\n        run: |\n          set -euo pipefail\n          git init repository\n          git -C repository remote add origin https://github.com/${GITHUB_REPOSITORY}.git\n          git -C repository fetch --no-tags --depth=3 origin \"${GITHUB_SHA}\"\n          git -C repository checkout --detach FETCH_HEAD\n          test \"$(git -C repository rev-parse HEAD)\" = \"${GITHUB_SHA}\"\n      - name: Verify source and evidence boundaries\n        shell: bash\n        run: |\n          set -euo pipefail\n          cd repository\n          test ! -e trillionnium/crates/trnm-game-server/build.rs\n          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in\n          ! grep -R --line-number --fixed-strings 'trnm_game_server_lib_generated.rs' trillionnium/crates/trnm-game-server\n          ! grep -R --line-number --fixed-strings 'include!(concat!(env!(\"OUT_DIR\")' trillionnium/crates/trnm-game-server\n          for path in \\n            .github/workflows/tmp-world-plan-v4-atomic-finalizer-v8.yml \\n            .github/workflows/tmp-world-plan-v4-atomic-finalizer-v9.yml \\n            .github/workflows/tmp-world-v13k-object-import-v2.yml \\n            .github/workflows/tmp-world-v13k-publish-qualified-tree-v3.yml \\n            docs/status/candidate-static-evidence-v8.txt \\n            docs/status/cross-repository-blob-probe.txt \\n            docs/evidence/.connector-write-capability-probe; do\n            test ! -e \"$path\"\n          done\n          python3 - <<'PY2'\n          import json\n          d=json.load(open('docs/status/world-plan-v4-source-closure-v1.json'))\n          assert d['qualified_source_tree']=='5e613185f5a2abda42df371f3755e73667717309'\n          assert d['world_owned_source_development_closed'] is True\n          assert d['repository_review_closed'] is False\n          assert d['all_plan_gaps_closed'] is False\n          assert all(v=='open' for v in d['external_evidence_gaps'].values())\n          PY2\n          grep -Eq '@ProfHepta|@Franksudoman' .github/CODEOWNERS\n          source=$(python3 -c \"import json; print(json.load(open('docs/status/world-plan-v4-source-closure-v1.json'))['qualified_source_commit'])\")\n          git cat-file -e \"${source}^{commit}\"\n          while IFS= read -r path; do\n            case \"$path\" in\n              .github/CODEOWNERS|.github/workflows/trnm-world-v4-closure-contract.yml|docs/status/world-plan-v4-source-closure-v1.json|'') ;;\n              *) echo \"unexpected post-qualification path: $path\" >&2; exit 1 ;;\n            esac\n          done < <(git diff --name-only \"${source}\" HEAD)\n          printf 'TRNM_WORLD_V4_CLOSURE_CONTRACT=PASS\\n'\n'''
          files={
              '.github/CODEOWNERS':codeowners,
              '.github/workflows/trnm-world-v4-closure-contract.yml':closure,
              'docs/status/world-plan-v4-source-closure-v1.json':json.dumps(ledger,indent=2,sort_keys=True)+'\n'}
          gov=[]
          for path,content in files.items():
              blob=api('POST',f'/repos/{repo}/git/blobs',{'content':content,'encoding':'utf-8'})
              gov.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          final_tree=api('POST',f'/repos/{repo}/git/trees',{'base_tree':expected_tree,'tree':gov})['sha']
          final_commit=api('POST',f'/repos/{repo}/git/commits',{
              'message':f'governance(world): bind qualified source to independent closure controls\n\nQualified-Source-Commit: {source_sha}\nQualified-Source-Tree: {expected_tree}\n',
              'tree':final_tree,'parents':[source_sha]})
          final_sha=final_commit['sha']
          if api('GET',f'/repos/{repo}/branches/{encoded}')['commit']['sha']!=bootstrap:
              raise SystemExit('branch moved during v9 transaction')
          api('PATCH',f'/repos/{repo}/git/refs/heads/{branch}',{'sha':final_sha,'force':False})
          readback=api('GET',f'/repos/{repo}/git/commits/{final_sha}')
          if readback['tree']['sha']!=final_tree: raise SystemExit('final tree read-back mismatch')
          if api('GET',f'/repos/{repo}/branches/{encoded}')['commit']['sha']!=final_sha:
              raise SystemExit('final ref read-back mismatch')
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as f:
              f.write(f'source_sha={source_sha}\nfinal_sha={final_sha}\nfinal_tree={final_tree}\n')
          print(f'TRNM_WORLD_SOURCE_COMMIT={source_sha}')
          print(f'TRNM_WORLD_FINAL_COMMIT={final_sha}')
          print(f'TRNM_WORLD_FINAL_TREE={final_tree}')
          print('TRNM_WORLD_V9_PUBLICATION=PASS')
          PY

      - name: Clone exact final head and initialize statuses
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          test -n "${FINAL_SHA}"
          git init final
          git -C final remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git -C final fetch --no-tags --depth=3 origin "${FINAL_SHA}"
          git -C final checkout --detach FETCH_HEAD
          test "$(git -C final rev-parse HEAD)" = "${FINAL_SHA}"
          for context in \
            trnm-world-v4/docs-governance \
            trnm-world-v4/transition-contract \
            trnm-world-v4/settlement-postgres \
            trnm-world-v4/game-workspace-release \
            trnm-world-v4/supply-chain \
            trnm-world-v4/closure-contract \
            trnm-world-v4/qualified-source-exact-head; do
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
              -d "{\"state\":\"pending\",\"context\":\"${context}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          done

      - name: Docs and governance exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          cd final
          test ! -e .github/workflows/tmp-world-plan-v4-atomic-finalizer-v8.yml
          test ! -e .github/workflows/tmp-world-plan-v4-atomic-finalizer-v9.yml
          test ! -e .github/workflows/tmp-world-v13k-object-import-v2.yml
          test ! -e .github/workflows/tmp-world-v13k-publish-qualified-tree-v3.yml
          test ! -e docs/status/candidate-static-evidence-v8.txt
          test ! -e docs/status/cross-repository-blob-probe.txt
          test ! -e docs/evidence/.connector-write-capability-probe
          test ! -e trillionnium/crates/trnm-game-server/build.rs
          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in
          python3 -m json.tool docs/status/world-plan-v4-source-closure-v1.json >/dev/null
          grep -Eq '@ProfHepta|@Franksudoman' .github/CODEOWNERS
          python3 - <<'PY'
          import json
          d=json.load(open('docs/status/world-plan-v4-source-closure-v1.json'))
          assert d['qualified_source_tree']=='5e613185f5a2abda42df371f3755e73667717309'
          assert d['world_owned_source_development_closed'] is True
          assert d['repository_review_closed'] is False
          assert d['all_plan_gaps_closed'] is False
          assert all(v=='open' for v in d['external_evidence_gaps'].values())
          PY
          cd ..
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/docs-governance\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Transition contract exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          cd final
          python3 scripts/check-trnm-world-transition-conformance.py
          cargo test --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml --locked
          cargo clippy --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml --all-targets --locked -- -D warnings
          cd ..
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/transition-contract\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: PostgreSQL settlement exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          cd final/trillionnium
          cargo test -p trnm-game-server --test settlement_database_contract --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_fault_model --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_worker_contract --locked -- --nocapture
          cargo test -p trnm-game-server --test settlement_runtime_v2_contract --locked -- --nocapture
          cd ../..
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/settlement-postgres\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Workspace and release exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          cd final
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test direct_source_bundle --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test direct_cex_source_contract --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server --all-targets --locked -- -D warnings
          cargo build --manifest-path trillionnium/Cargo.toml -p trnm-game-server --release --locked
          cd ..
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/game-workspace-release\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Supply-chain exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          cd final
          test -f trillionnium/Cargo.lock
          cargo metadata --manifest-path trillionnium/Cargo.toml --locked --no-deps >/tmp/trnm-world-metadata.json
          python3 - <<'PY'
          import json,pathlib,re
          json.load(open('/tmp/trnm-world-metadata.json'))
          failures=[]
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              text=path.read_text()
              for m in re.finditer(r'uses:\s*([^\s#]+)',text):
                  value=m.group(1)
                  if value.startswith('./') or re.search(r'@[0-9a-f]{40}$',value): continue
                  failures.append(f'{path}:{value}')
              if 'contents: write' in text and not path.name.startswith('tmp-'):
                  failures.append(f'{path}:contents-write')
          if failures: raise SystemExit('mutable workflow boundary: '+', '.join(failures))
          toolchain=pathlib.Path('rust-toolchain.toml').read_text()
          if 'channel = "1.98.0"' not in toolchain: raise SystemExit('toolchain is not pinned')
          PY
          cd ..
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"trnm-world-v4/supply-chain\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Closure contract and aggregate exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
          SOURCE_SHA='${{ steps.publish.outputs.source_sha }}'
          cd final
          test "$(git rev-parse HEAD^)" = "${SOURCE_SHA}"
          while IFS= read -r path; do
            case "$path" in
              .github/CODEOWNERS|.github/workflows/trnm-world-v4-closure-contract.yml|docs/status/world-plan-v4-source-closure-v1.json|'') ;;
              *) echo "unexpected post-qualification path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "${SOURCE_SHA}" HEAD)
          cd ..
          for context in trnm-world-v4/closure-contract trnm-world-v4/qualified-source-exact-head; do
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
              -d "{\"state\":\"success\",\"context\":\"${context}\",\"description\":\"Plan V4 qualified direct-source exact-head gate passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
          done

      - name: Request latest-head independent review and clean transport branches
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.publish.outputs.final_sha }}'
