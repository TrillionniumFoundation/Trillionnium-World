name: prune-obsolete-control-runs-v1

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-obsolete-world-control-runs
  cancel-in-progress: true

jobs:
  prune:
    name: control/prune-obsolete-world-runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel obsolete and duplicate control-plane runs
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          current_id = int(os.environ['GITHUB_RUN_ID'])
          token = os.environ['GH_ACTIONS_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          obsolete = {
              'p0-statement-let-fix-58f76a-20260910',
              'p0-statement-let-apply-v2',
              'world-source-qualification-chain-v3',
              'world-exact-tuple-qualification-v4',
              'world-exact-tuple-qualification-v5',
              'world-p0-apply-fallback-v4',
              'world-rts-test-module-migration-v1',
              'world-exact-tuple-qualification-v5',
          }
          preferred = {
              'world-p0-descendant-fallback-v5',
              'world-rts-test-module-migration-v2',
              'world-final-exact-tuple-after-migration-v6',
              'world-final-governance-readback-v1',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          runs = []
          for page in range(1, 11):
              query = urllib.parse.urlencode({
                  'branch': branch,
                  'per_page': 100,
                  'page': page,
              })
              batch = get(
                  f'https://api.github.com/repos/{repo}/actions/runs?{query}'
              ).get('workflow_runs', [])
              runs.extend(batch)
              if len(batch) < 100:
                  break

          active = [
              run for run in runs
              if run.get('status') in {'queued', 'in_progress', 'waiting', 'pending'}
              and int(run.get('id', 0)) != current_id
          ]
          newest = {}
          for run in active:
              name = run.get('name')
              if name in preferred:
                  old = newest.get(name)
                  if old is None or int(run['id']) > int(old['id']):
                      newest[name] = run

          cancelled = []
          for run in active:
              name = run.get('name')
              should_cancel = name in obsolete
              if name in preferred and newest.get(name, {}).get('id') != run.get('id'):
                  should_cancel = True
              if not should_cancel:
                  continue
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                  data=b'{}',
                  method='POST',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code not in {409, 422}:
                      raise
              cancelled.append((run['id'], name, run.get('head_sha')))

          print(json.dumps({
              'schema': 'world.control-run-prune.v1',
              'branch': branch,
              'active_seen': len(active),
              'cancelled': cancelled,
              'preferred_kept': {
                  name: value.get('id') for name, value in sorted(newest.items())
              },
              'production_authorization': 'not_granted',
          }, indent=2, sort_keys=True))
          PY
