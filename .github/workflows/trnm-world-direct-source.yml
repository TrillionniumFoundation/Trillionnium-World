name: trnm-world-direct-source

on:
  pull_request:
    branches:
      - fix/world-plan-v4-convergence-2026-08-30
    paths:
      - 'trillionnium/crates/trnm-game-server/**'
      - 'scripts/check-trnm-settlement-transaction-boundary.sh'
      - 'scripts/check_trnm_settlement_transaction_boundary.sh'
      - '.github/workflows/trnm-world-direct-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-direct-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  direct-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Reject semantic generated-source paths
        shell: bash
        run: |
          set -euo pipefail
          crate=trillionnium/crates/trnm-game-server
          test ! -e "${crate}/build.rs"
          test ! -e "${crate}/src/lib.rs.in"
          ! grep -q '^build = "build.rs"$' "${crate}/Cargo.toml"
          ! grep -q 'trnm_game_server_lib_generated.rs' "${crate}/src/lib.rs"
          ! grep -q 'reconcile_economy(&state.cex' "${crate}/src/lib.rs"
          ! grep -q 'settle_pending_matches(&settlement_state' "${crate}/src/lib.rs"
          grep -q 'terminal settlement is owned by trnm-settlement-worker' "${crate}/src/lib.rs"

      - name: Validate directly compiled game-server
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --all-targets
          cargo test --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --all-targets
          cargo clippy --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --all-targets -- -D warnings

      - name: Enforce settlement transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh

      - name: Prove validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
