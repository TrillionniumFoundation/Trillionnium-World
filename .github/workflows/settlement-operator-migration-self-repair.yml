name: settlement-operator-migration-self-repair

on:
  push:
    branches:
      - fix/world-settlement-gap-closure-v1
    paths:
      - .github/workflows/settlement-operator-migration-self-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settlement-operator-migration-self-repair
  cancel-in-progress: false

jobs:
  repair:
    name: settlement-operator-migration-self-repair/exact-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "1"
      TRNM_CEX_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
      TRNM_REQUIRE_CEX_SETTLEMENT_DATABASE_TEST: "1"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/world-settlement-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and repair the exact migration blob
        run: |
          set -euo pipefail
          path=trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql
          test "$(git hash-object "$path")" = 47945203a73ed30c4125fa730e88a414938a7cfc
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql")
          text = path.read_text(encoding="utf-8")
          old = """    select job_row, capture.state
            into job, capture_state
            from public.trnm_online_settlement_jobs job_row
            join public.trnm_online_settlement_captures capture
              on capture.capture_id = job_row.capture_id
           where job_row.job_id = p_job_id
           for update of job_row, capture;
          if not found then
              raise exception using
                  errcode = 'P0002',
                  message = 'settlement replay target does not exist';
          end if;
          """
          new = """    select job_row.*
            into job
            from public.trnm_online_settlement_jobs job_row
            join public.trnm_online_settlement_captures capture
              on capture.capture_id = job_row.capture_id
           where job_row.job_id = p_job_id
           for update of job_row, capture;
          if not found then
              raise exception using
                  errcode = 'P0002',
                  message = 'settlement replay target does not exist';
          end if;

          select capture.state
            into capture_state
            from public.trnm_online_settlement_captures capture
           where capture.capture_id = job.capture_id;
          if not found then
              raise exception using
                  errcode = '55000',
                  message = 'settlement replay capture disappeared after lock';
          end if;
          """
          if text.count(old) != 1:
              raise SystemExit(f"reviewed invalid SELECT shape count was {text.count(old)}, expected 1")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "$path"
          grep -F 'select job_row.*' "$path"
          grep -F 'settlement replay capture disappeared after lock' "$path"
          if grep -F 'select job_row, capture.state' "$path"; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Prove the PostgreSQL operator contract
        working-directory: trillionnium
        run: |
          set -euo pipefail
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked
          cargo test -p trnm-game-server --test settlement_database_contract --locked

      - name: Assemble exact remediation evidence
        run: |
          set -euo pipefail
          mkdir -p remediation/trillionnium/crates/trnm-game-server/migrations
          cp trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql \
            remediation/trillionnium/crates/trnm-game-server/migrations/
          git diff --binary --full-index > remediation/remediation.patch
          printf '%s\n' \
            'base_commit=f604d14fbacbd53c3faf09045aaec192879a3f1e' \
            'base_blob=47945203a73ed30c4125fa730e88a414938a7cfc' \
            'rust_toolchain=1.98.0' \
            'postgres=16.4-alpine' \
            > remediation/identity.txt
          (
            cd remediation
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload exact remediation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settlement-operator-migration-repair-f604d14
          path: remediation/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Commit only the proven migration repair
        run: |
          set -euo pipefail
          path=trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$path"
          test "$(git diff --cached --name-only)" = "$path"
          git commit -m 'fix(settlement): repair operator migration record select'
          git push origin HEAD:fix/world-settlement-gap-closure-v1
