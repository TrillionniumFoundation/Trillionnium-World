name: world-scheduler-probe-r3

on:
  push:
    branches:
      - tmp/world-dispatch-probe-r2

permissions:
  issues: write

jobs:
  scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Record native scheduler allocation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          marker = {
              'schema': 'trillionnium.world.scheduler-probe.r3',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'head_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'production_authorization': 'not_granted',
          }
          body = '## Native Actions scheduler probe r3\n\n```json\n' + json.dumps(marker, indent=2, sort_keys=True) + '\n```\n\nThis proves only that GitHub allocated a native runner to the isolated probe branch. It is not a product check, protected status context, source qualification, merge approval, or production authorization.'
          request = urllib.request.Request(
              'https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/issues/54/comments',
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'world-scheduler-probe-r3',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'unexpected comment status: {response.status}')
          print(json.dumps(marker, sort_keys=True))
          PY
