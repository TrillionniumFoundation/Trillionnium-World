name: trnm-world-source-boundaries

on:
  push:
    branches:
      - fix/world-plan-v4-convergence-2026-08-30
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/check-trnm-ci-read-only.sh'
      - 'scripts/check-trnm-game-server-direct-source.sh'
      - 'trillionnium/crates/trnm-game-server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-source-boundaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-read-only:
    name: world-v4 / ci-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s\n' "commit=${GITHUB_SHA}" "tree=$(git rev-parse HEAD^{tree})"
      - name: Prove validation workflows are read-only and immutable
        shell: bash
        run: bash scripts/check-trnm-ci-read-only.sh
      - name: Prove checkout did not mutate source
        shell: bash
        run: test -z "$(git status --porcelain)"

  direct-source:
    name: world-v4 / direct-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s\n' "commit=${GITHUB_SHA}" "tree=$(git rev-parse HEAD^{tree})"
      - name: Require ordinary directly compiled game-server source
        shell: bash
        run: bash scripts/check-trnm-game-server-direct-source.sh
      - name: Prove checkout did not mutate source
        shell: bash
        run: test -z "$(git status --porcelain)"
