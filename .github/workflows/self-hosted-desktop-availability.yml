name: Self-hosted desktop runner availability

on:
  workflow_dispatch:

# This probe intentionally does not check out repository code and accepts no
# caller-controlled shell input. It proves only that a manual invocation from
# protected main can acquire the dedicated desktop-labelled runner.
permissions: {}

jobs:
  runner-probe:
    name: Desktop runner probe
    runs-on:
      - self-hosted
      - linux
      - x64
      - desktop
    timeout-minutes: 10
    steps:
      - name: Verify trusted manual main invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = desktop
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64

      - name: Emit minimal non-sensitive receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'probe=pass\nref=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REF" "$RUNNER_OS" "$RUNNER_ARCH"
