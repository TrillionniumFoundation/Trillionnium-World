name: trnm-world-transition-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/contracts/trnm-world-transition-v1/**'
      - 'docs/protocol/trnm-world-transition-v1.md'
      - 'docs/protocol/schemas/trnm-world-transition-v1.schema.json'
      - 'docs/protocol/vectors/trnm-world-transition-v1.json'
      - 'scripts/check-trnm-world-transition-contract.sh'
      - 'scripts/test-trnm-world-transition-contract-negative.sh'
      - '.github/workflows/trnm-world-transition-contract.yml'
  push:
    branches:
      - main
      - feature/world-deterministic-transition-contract-v1
    paths:
      - 'trillionnium/contracts/trnm-world-transition-v1/**'
      - 'docs/protocol/trnm-world-transition-v1.md'
      - 'docs/protocol/schemas/trnm-world-transition-v1.schema.json'
      - 'docs/protocol/vectors/trnm-world-transition-v1.json'
      - 'scripts/check-trnm-world-transition-contract.sh'
      - 'scripts/test-trnm-world-transition-contract-negative.sh'
      - '.github/workflows/trnm-world-transition-contract.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-transition-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate schema, vectors, hashes and authority boundary
        run: bash scripts/check-trnm-world-transition-contract.sh
      - name: Prove forbidden and corrupt fixtures fail closed
        run: bash scripts/test-trnm-world-transition-contract-negative.sh

  contract-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact stable Rust action revision
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Verify dependency-free package metadata
        run: >-
          cargo metadata
          --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
          --locked --no-deps
      - name: Format reference package
        run: >-
          cargo fmt
          --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
          -- --check
      - name: Test reference package
        run: >-
          cargo test
          --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
          --locked
      - name: Clippy reference package
        run: >-
          cargo clippy
          --manifest-path trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
          --locked -- -D warnings
