name: trnm-world-governance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - fix/world-settlement-cex-component-lock-v1
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/trnm-world-governance.yml'
      - 'docs/status/world-main-governance-v1.json'
      - 'scripts/check-world-main-governance.py'
  push:
    branches:
      - fix/world-settlement-gap-closure-v1
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/trnm-world-governance.yml'
      - 'docs/status/world-main-governance-v1.json'
      - 'scripts/check-world-main-governance.py'

permissions:
  contents: read

jobs:
  source-contract:
    name: trnm-world-governance/source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse and enforce governance source
        run: |
          python3 -m py_compile scripts/check-world-main-governance.py
          python3 -m json.tool docs/status/world-main-governance-v1.json > /dev/null
          python3 scripts/check-world-main-governance.py
