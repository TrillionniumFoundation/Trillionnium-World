name: trnm-world-governance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix/world-plan-v4-source-gap-closure

permissions:
  contents: read

concurrency:
  group: trnm-world-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: trnm-world-governance/source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse and enforce governance source
        run: |
          python3 -m py_compile scripts/check-world-main-governance.py
          python3 -m json.tool docs/status/world-main-governance-v1.json > /dev/null
          python3 scripts/check-world-main-governance.py
      - name: Enforce read-only review integrity
        run: bash scripts/check-trnm-review-integrity.sh
