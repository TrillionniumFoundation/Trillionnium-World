name: world-pr-native-admission-v2

on:
  push:
    branches:
      - refactor/campaign-module-stack-v2-20260909
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-native-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  game:
    name: trnm-game-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify exact head and prospective merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          checkout_exact() {
            local destination="$1"
            local ref="$2"
            local expected="$3"
            rm -rf "$destination"
            git init -q "$destination"
            git -C "$destination" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$destination" fetch -q --no-tags --depth=1 origin "$ref"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$expected"
          }
          checkout_exact "$RUNNER_TEMP/world-head" "$HEAD_SHA" "$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_exact "$RUNNER_TEMP/world-merge" "refs/pull/${PR_NUMBER}/merge" "$MERGE_SHA"
          else
            checkout_exact "$RUNNER_TEMP/world-merge" "$MERGE_SHA" "$MERGE_SHA"
          fi
          printf 'head=%s\nmerge=%s\n' "$HEAD_SHA" "$MERGE_SHA"

      - name: Install pinned toolchain and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
          rustup toolchain install 1.98.1 \
            --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "1.98.1"

      - name: Execute truth and source qualification on both objects
        run: |
          set -euo pipefail
          for source in "$RUNNER_TEMP/world-head" "$RUNNER_TEMP/world-merge"; do
            echo "qualifying $source @ $(git -C "$source" rev-parse HEAD)"
            (
              cd "$source"
              bash scripts/run-trnm-world-v6-qualification-v2.sh truth
              bash scripts/run-trnm-world-v6-qualification-v2.sh source
              test -z "$(git status --porcelain=v1 --untracked-files=no)"
            )
          done
          printf 'WORLD_NATIVE_HEAD_AND_MERGE_SOURCE=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  boundaries:
    name: trnm-world-p0-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Fetch and verify exact head and prospective merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          checkout_exact() {
            local destination="$1"
            local ref="$2"
            local expected="$3"
            rm -rf "$destination"
            git init -q "$destination"
            git -C "$destination" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$destination" fetch -q --no-tags --depth=1 origin "$ref"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$expected"
          }
          checkout_exact "$RUNNER_TEMP/world-head" "$HEAD_SHA" "$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_exact "$RUNNER_TEMP/world-merge" "refs/pull/${PR_NUMBER}/merge" "$MERGE_SHA"
          else
            checkout_exact "$RUNNER_TEMP/world-merge" "$MERGE_SHA" "$MERGE_SHA"
          fi

      - name: Install PostgreSQL client and pinned Rust toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          rustup toolchain install 1.98.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = "1.98.1"
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"

      - name: Execute PostgreSQL and fencing qualification on both objects
        run: |
          set -euo pipefail
          index=0
          for source in "$RUNNER_TEMP/world-head" "$RUNNER_TEMP/world-merge"; do
            index=$((index + 1))
            database="world_native_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${index}"
            database="${database//[^A-Za-z0-9_]/_}"
            createdb "$database"
            cleanup_database() {
              dropdb --if-exists --force "$database" >/dev/null 2>&1 || true
            }
            trap cleanup_database EXIT
            echo "qualifying $source @ $(git -C "$source" rev-parse HEAD) against $database"
            (
              cd "$source"
              export DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/${database}"
              export TEST_DATABASE_URL="$DATABASE_URL"
              bash scripts/run-trnm-world-v6-qualification-v2.sh postgres
              test -z "$(git status --porcelain=v1 --untracked-files=no)"
            )
            cleanup_database
            trap - EXIT
          done
          printf 'WORLD_NATIVE_HEAD_AND_MERGE_POSTGRES=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  status:
    name: trnm-world-status-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify exact head and prospective merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          checkout_exact() {
            local destination="$1"
            local ref="$2"
            local expected="$3"
            rm -rf "$destination"
            git init -q "$destination"
            git -C "$destination" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$destination" fetch -q --no-tags --depth=1 origin "$ref"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$expected"
          }
          checkout_exact "$RUNNER_TEMP/world-head" "$HEAD_SHA" "$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_exact "$RUNNER_TEMP/world-merge" "refs/pull/${PR_NUMBER}/merge" "$MERGE_SHA"
          else
            checkout_exact "$RUNNER_TEMP/world-merge" "$MERGE_SHA" "$MERGE_SHA"
          fi

      - name: Install pinned package dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev
          rustup toolchain install 1.98.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = "1.98.1"

      - name: Build and verify release packages on both objects
        run: |
          set -euo pipefail
          for source in "$RUNNER_TEMP/world-head" "$RUNNER_TEMP/world-merge"; do
            echo "packaging $source @ $(git -C "$source" rev-parse HEAD)"
            (
              cd "$source"
              bash scripts/run-trnm-world-v6-qualification-v2.sh package
              grep -Eqi 'NO-GO|NO_GO|not[_ -]granted|not release-ready' RELEASE_READINESS.md
              test -z "$(git status --porcelain=v1 --untracked-files=no)"
            )
          done
          printf 'WORLD_NATIVE_HEAD_AND_MERGE_PACKAGE=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"
