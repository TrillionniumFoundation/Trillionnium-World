name: trnm-settlement-fencing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix/world-plan-v4-source-gap-closure

permissions:
  contents: read

concurrency:
  group: trnm-settlement-fencing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  TRNM_RUST_TOOLCHAIN: '1.98.0'

jobs:
  static-contracts:
    name: trnm-settlement-fencing/static-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse Python and JSON artifacts
        run: |
          python3 -m py_compile \
            scripts/check-trnm-settlement-runtime-status.py \
            scripts/test-trnm-settlement-runtime-status-negative.py
          python3 -m json.tool docs/status/settlement-runtime-v1.json > /dev/null
          python3 -m json.tool docs/status/settlement-runtime-v1.schema.json > /dev/null
      - name: Validate machine-readable settlement posture
        run: python3 scripts/check-trnm-settlement-runtime-status.py
      - name: Reject status overclaims
        run: python3 scripts/test-trnm-settlement-runtime-status-negative.py
      - name: Enforce transaction, identity, recovery and evidence boundaries
        run: |
          bash -n scripts/check-trnm-settlement-transaction-boundary.sh
          bash -n scripts/check_trnm_settlement_transaction_boundary.sh
          ./scripts/check-trnm-settlement-transaction-boundary.sh
          ./scripts/check_trnm_settlement_transaction_boundary.sh

  rust-contracts:
    name: trnm-settlement-fencing/rust-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: '1'
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$TRNM_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TRNM_RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version --verbose
      - name: Resolve locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Game-server library and generated ownership contracts
        run: |
          cargo test -p trnm-game-server --lib --locked
          cargo test -p trnm-game-server --test settlement_game_server_boundary --locked
      - name: Entitlement signer route and policy contracts
        run: cargo test -p trnm-game-server --bin trnm-entitlement-signer --locked
      - name: Settlement remote identity contract
        run: cargo test -p trnm-game-server --test settlement_remote_identity_contract --locked
      - name: Settlement worker contract
        run: cargo test -p trnm-game-server --test settlement_worker_contract --locked
      - name: Settlement fault model
        run: cargo test -p trnm-game-server --test settlement_fault_model --locked
      - name: PostgreSQL capture commit boundary
        run: cargo test -p trnm-game-server --test settlement_capture_commit_boundary --locked
      - name: PostgreSQL identity and lease contract
        run: cargo test -p trnm-game-server --test settlement_database_contract --locked
      - name: PostgreSQL account serialization contract
        run: cargo test -p trnm-game-server --test settlement_serialization_database --locked
      - name: PostgreSQL operator replay and retention controls
        run: cargo test -p trnm-game-server --test settlement_operator_controls_database --locked
      - name: Strict game-server lint
        run: cargo clippy -p trnm-game-server --all-targets --locked -- -D warnings
