name: world-source-qualification-chain-v3

on:
  push:
    branches:
      - ops/p0-statement-let-fix-58f76a-20260910

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: world-source-qualification-chain-v3
  cancel-in-progress: false

jobs:
  qualify:
    name: world-source/exact-descendant-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ORIGINAL_HEAD: 58f76a6100bade6e148a56bd429eff34f8a255cd
      TARGET_BRANCH: refactor/campaign-module-stack-v2-20260909
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Fetch current target and exact helper
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$work" "$helper"
          git init "$work"
          git -C "$work" remote add origin "https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$work" fetch --no-tags origin "$TARGET_BRANCH" "$ORIGINAL_HEAD"
          git -C "$work" checkout --detach "origin/$TARGET_BRANCH"
          git -C "$work" merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test -s "$helper/scripts/patch-p0-statement-let.py"
          printf 'WORLD_CHAIN_INPUT_HEAD=%s\n' "$(git -C "$work" rev-parse HEAD)"

      - name: Ensure the exact scanner repair is present once
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          target="$work/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"
          if grep -Fq 'fn statement_let_at(bytes: &[u8], start: usize) -> bool' "$target"; then
            test "$(grep -Fc 'fn statement_let_at(bytes: &[u8], start: usize) -> bool' "$target")" -eq 1
            test "$(grep -Fc '_ if statement_let_at(bytes, cursor) => {' "$target")" -eq 1
            test "$(grep -Fc 'async fn pattern_let_before_captured_backend()' "$target")" -eq 1
            printf 'WORLD_P0_REPAIR=already_present\n'
          else
            test "$(git -C "$work" rev-parse HEAD)" = "$ORIGINAL_HEAD"
            python3 "$RUNNER_TEMP/helper/scripts/patch-p0-statement-let.py" "$target"
            git -C "$work" diff --check
            test "$(git -C "$work" diff --name-only)" = \
              'trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs'
            printf 'WORLD_P0_REPAIR=applied_in_chain\n'
          fi

      - name: Execute closed-world source gates
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          cd "$work"
          for script in \
            scripts/check-trnm-world-component-catalog.py \
            scripts/test-trnm-world-component-catalog.py \
            scripts/check-trnm-world-include-boundaries.py \
            scripts/test-trnm-world-include-boundaries.py; do
            test -s "$script"
            python3 "$script"
          done

      - name: Execute complete Rust workspace qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          work="$RUNNER_TEMP/world"
          cd "$work"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Fast-forward target only when this run created the repair
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/world"
          if test -z "$(git -C "$work" status --porcelain)"; then
            printf 'WORLD_TARGET_ALREADY_CONTAINS_REPAIR=true\n'
            exit 0
          fi
          test "$(git -C "$work" rev-parse HEAD)" = "$ORIGINAL_HEAD"
          git -C "$work" config user.name 'ProfHepta'
          git -C "$work" config user.email '102159240+ProfHepta@users.noreply.github.com'
          git -C "$work" add trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs
          git -C "$work" commit -m 'fix(p0): distinguish statement let from pattern bindings'
          new_head="$(git -C "$work" rev-parse HEAD)"
          git -C "$work" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_head="$(git -C "$work" ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$new_head"
          printf 'WORLD_PR_BRANCH_ADVANCED=%s\n' "$new_head"
          printf 'FORCE_UPDATE=false\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
