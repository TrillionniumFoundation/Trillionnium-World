name: tmp-world-plan-v4-apply-qualified-source

on:
  push:
    branches:
      - fix/world-plan-v4-development-closure-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-apply-qualified-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-world-plan-v4-apply-qualified-source
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  RUST_TOOLCHAIN: "1.98.0"
  SOURCE_WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
  CONTROL_HEAD: "193d08ee2610d348ce82ba08e8fb9de4dd35f4d1"
  TARGET_BRANCH: "fix/world-plan-v4-development-closure-20260831"

jobs:
  qualify-apply-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch immutable source and qualification controls
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/world-source
          git -C /tmp/world-source remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C /tmp/world-source fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C /tmp/world-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/world-source rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          git init /tmp/world-control
          git -C /tmp/world-control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C /tmp/world-control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C /tmp/world-control checkout --detach FETCH_HEAD
          test "$(git -C /tmp/world-control rev-parse HEAD)" = "${CONTROL_HEAD}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Produce the exact qualified source patch
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/world-control/tmp/world-plan-v4-v8-patch/qualify-v8.sh \
            /tmp/world-source \
            /tmp/world-control \
            /tmp/world-qualified
          test -s /tmp/world-qualified/world-v10-source.patch
          sha256sum /tmp/world-qualified/world-v10-source.patch
          cat /tmp/world-qualified/identity.txt

      - name: Apply qualified patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"
          git apply --check /tmp/world-qualified/world-v10-source.patch
          git apply /tmp/world-qualified/world-v10-source.patch
          git diff --check
          test ! -e trillionnium/crates/trnm-game-server/build.rs
          test ! -e trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -q 'trnm_game_server_lib_generated.rs' trillionnium/crates/trnm-game-server/src/lib.rs

      - name: Requalify exact post-apply branch tree
        shell: bash
        run: |
          set -euo pipefail
          manifest=trillionnium/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo test --manifest-path "$manifest" --locked -p trnm-campaign-core --lib
          cargo test --manifest-path "$manifest" --locked -p trnm-rts-sim --lib
          cargo check --manifest-path "$manifest" --locked -p trnm-game-server --all-targets
          cargo clippy --manifest-path "$manifest" --locked \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets -- -D warnings
          git diff --check

      - name: Commit and push only the qualified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trnm-world-qualification-bot"
          git config user.email "trnm-world-qualification-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "qualified source is already present"
            exit 0
          }
          git commit -m "fix(world): close direct-source and command atomicity blockers"
          git push origin "HEAD:${TARGET_BRANCH}"
