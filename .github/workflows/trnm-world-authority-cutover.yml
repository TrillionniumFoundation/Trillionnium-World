name: trnm-world-authority-cutover

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/crates/world-authority/**'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - 'docs/contracts/trillionnium-world-authority-provenance-v1.json'
      - 'docs/architecture/cex-world-authority-cutover-v1.md'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'scripts/check-trnm-world-authority-provenance.py'
      - '.github/workflows/trnm-world-authority-cutover.yml'
  push:
    branches: [main, 'feat/p0-world-authority-cutover-*']
    paths:
      - 'trillionnium/crates/world-authority/**'
      - 'docs/contracts/trillionnium-world-authority-cutover-v1.json'
      - 'docs/contracts/trillionnium-world-authority-provenance-v1.json'
      - 'docs/architecture/cex-world-authority-cutover-v1.md'
      - 'scripts/check-trnm-world-authority-cutover.sh'
      - 'scripts/check-trnm-world-authority-provenance.py'
      - '.github/workflows/trnm-world-authority-cutover.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-authority-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  RUST_TOOLCHAIN_ACTION_SHA: 6bed0761d98439e5a578e2877258200ad565ba87
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  authority-source-qualification:
    name: trnm-world-authority-cutover/source-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source head with full provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source, base, trigger and prospective-merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain)"

          source_tree="$(git rev-parse "${SOURCE_HEAD_SHA}^{tree}")"
          trigger_sha="$GITHUB_SHA"
          if ! git cat-file -e "${trigger_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$trigger_sha"
          fi
          trigger_tree="$(git rev-parse "${trigger_sha}^{tree}")"

          if [[ -n "$BASE_SHA" ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            base_tree="$(git rev-parse "${BASE_SHA}^{tree}")"
            merge_tree_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
            prospective_merge_tree="$(printf '%s\n' "$merge_tree_output" | head -n1)"
            [[ "$prospective_merge_tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='Trillionnium qualification'
            export GIT_AUTHOR_EMAIL='qualification@trillionnium.invalid'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            prospective_merge_commit="$(
              printf 'Synthetic prospective merge for qualification only\n' \
                | git commit-tree "$prospective_merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA"
            )"
          else
            base_tree=''
            prospective_merge_tree="$source_tree"
            prospective_merge_commit="$SOURCE_HEAD_SHA"
          fi

          {
            echo "source_tree=$source_tree"
            echo "base_tree=$base_tree"
            echo "trigger_tree=$trigger_tree"
            echo "prospective_merge_tree=$prospective_merge_tree"
            echo "prospective_merge_commit=$prospective_merge_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Install immutable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Record toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/ci-world-authority
          rustc --version --verbose | tee run/ci-world-authority/rustc-version.txt
          cargo --version --verbose | tee run/ci-world-authority/cargo-version.txt
          rustfmt --version | tee run/ci-world-authority/rustfmt-version.txt
          cargo clippy --version | tee run/ci-world-authority/clippy-version.txt
          rustc_version="$(rustc --version | awk '{print $2}')"
          test "$rustc_version" = "$RUST_TOOLCHAIN"

      - name: Validate exact source head
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/world-authority-target
        run: bash scripts/check-trnm-world-authority-cutover.sh

      - name: Validate prospective merge tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/world-authority-target
          PROSPECTIVE_MERGE_COMMIT: ${{ steps.identity.outputs.prospective_merge_commit }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/world-authority-prospective-merge"
          git worktree add --detach "$worktree" "$PROSPECTIVE_MERGE_COMMIT"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse HEAD^{tree})" = "${{ steps.identity.outputs.prospective_merge_tree }}"
          bash "$worktree/scripts/check-trnm-world-authority-cutover.sh"
          test -z "$(git -C "$worktree" status --porcelain --untracked-files=no)"

      - name: Record exact source and prospective-merge evidence
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          BASE_TREE: ${{ steps.identity.outputs.base_tree }}
          TRIGGER_TREE: ${{ steps.identity.outputs.trigger_tree }}
          PROSPECTIVE_MERGE_TREE: ${{ steps.identity.outputs.prospective_merge_tree }}
          PROSPECTIVE_MERGE_COMMIT: ${{ steps.identity.outputs.prospective_merge_commit }}
        run: |
          set -euo pipefail
          out=run/ci-world-authority
          manifest=trillionnium/crates/world-authority/Cargo.toml
          mkdir -p "$out"
          cargo run --quiet --locked --manifest-path "$manifest" -p trnm-world-server -- adapter-readiness > "$out/adapter-readiness.json"
          cargo run --quiet --locked --manifest-path "$manifest" -p trnm-world-server -- full-split-json > "$out/full-split.json"
          cargo run --quiet --locked --manifest-path "$manifest" -p trnm-world-server -- dev-runtime-repository-smoke "$out/world-state.json" > "$out/repository-restart-reload.json"
          git ls-tree -r "$SOURCE_HEAD_SHA" -- trillionnium/crates/world-authority \
            > "$out/source-authority-tree.txt"
          git ls-tree -r "$PROSPECTIVE_MERGE_COMMIT" -- trillionnium/crates/world-authority \
            > "$out/prospective-merge-authority-tree.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          out = pathlib.Path('run/ci-world-authority')
          workflow_path = pathlib.Path('.github/workflows/trnm-world-authority-cutover.yml')
          provenance_path = pathlib.Path('docs/contracts/trillionnium-world-authority-provenance-v1.json')
          checker_path = pathlib.Path('scripts/check-trnm-world-authority-provenance.py')

          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          summary = {
              'schema': 'trillionnium.world.authority.source-evidence.v2',
              'status': 'source_and_prospective_merge_qualification_green',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': os.environ['SOURCE_TREE'],
              'base_sha': os.environ.get('BASE_SHA') or None,
              'base_tree': os.environ.get('BASE_TREE') or None,
              'trigger_sha': os.environ['GITHUB_SHA'],
              'trigger_tree': os.environ['TRIGGER_TREE'],
              'prospective_merge_tree': os.environ['PROSPECTIVE_MERGE_TREE'],
              'prospective_merge_commit': os.environ['PROSPECTIVE_MERGE_COMMIT'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'workflow_blob_sha': os.popen(
                  'git rev-parse HEAD:.github/workflows/trnm-world-authority-cutover.yml'
              ).read().strip(),
              'workflow_sha256': sha256(workflow_path),
              'actions': {
                  'actions/checkout': os.environ['CHECKOUT_ACTION_SHA'],
                  'dtolnay/rust-toolchain': os.environ['RUST_TOOLCHAIN_ACTION_SHA'],
                  'actions/upload-artifact': os.environ['UPLOAD_ARTIFACT_ACTION_SHA'],
              },
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'contract_version': 'trillionnium_world_authority_cutover_v1',
              'provenance_schema': 'trillionnium.world.authority.provenance.v1',
              'provenance_manifest_blob_sha': os.popen(
                  'git rev-parse HEAD:docs/contracts/trillionnium-world-authority-provenance-v1.json'
              ).read().strip(),
              'provenance_manifest_sha256': sha256(provenance_path),
              'provenance_checker_blob_sha': os.popen(
                  'git rev-parse HEAD:scripts/check-trnm-world-authority-provenance.py'
              ).read().strip(),
              'provenance_checker_sha256': sha256(checker_path),
              'production_authorization': 'not_granted',
              'no_dual_writer_claim': False,
              'qualification_scope': [
                  'exact_historical_tree_and_blob_provenance',
                  'omission_substitution_extra_file_hostile_fixtures',
                  'format',
                  'all_target_tests',
                  'clippy_deny_warnings',
                  'source_head_runtime_smokes',
                  'prospective_merge_tree_runtime_smokes',
                  'file_repository_restart_reload',
              ],
          }
          (out / 'source-evidence-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )

          artifact_paths = sorted(
              path for path in out.iterdir()
              if path.is_file() and path.name != 'artifact-manifest.json'
          )
          artifact_manifest = {
              'schema': 'trillionnium.world.authority.artifact-manifest.v1',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'prospective_merge_tree': os.environ['PROSPECTIVE_MERGE_TREE'],
              'files': [
                  {
                      'path': path.name,
                      'bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  }
                  for path in artifact_paths
              ],
          }
          (out / 'artifact-manifest.json').write_text(
              json.dumps(artifact_manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload immutable qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-authority-source-${{ env.SOURCE_HEAD_SHA }}
          path: run/ci-world-authority/**
          if-no-files-found: error
          retention-days: 90
