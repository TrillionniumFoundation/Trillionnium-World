name: tmp-world-v13k-object-import

# Re-run nonce: 2026-09-01-v2
on:
  push:
    branches:
      - chore/world-object-import-v13k-20260901
    paths:
      - .github/workflows/tmp-world-v13k-object-import.yml
  workflow_dispatch:

# This temporary transport lane may create unreferenced Git blob/tree objects.
# It must not create a commit, update a ref, push, merge, tag, deploy, or promote.
permissions:
  contents: write

concurrency:
  group: tmp-world-v13k-object-import
  cancel-in-progress: true

jobs:
  qualify-and-import-unreferenced-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
      RUST_TOOLCHAIN: "1.98.0"
      SOURCE_WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
      TARGET_WORLD_HEAD: "ed55d48863166a915eac18bc0f2f3e81ce9347da"
      TARGET_WORLD_BRANCH: "fix/world-plan-v4-development-closure-20260831"
      CONTROL_HEAD: "917db5b73fb5a1ae19682709bdcfd7194852d99a"
      EXPECTED_SOURCE_PATCH_SHA256: "ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f"
      EXPECTED_SOURCE_CANDIDATE_TREE: "5e613185f5a2abda42df371f3755e73667717309"
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "0"

    steps:
      - name: Reconstruct and qualify immutable source candidate
        shell: bash
        run: |
          set -euo pipefail

          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${CONTROL_HEAD}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${CONTROL_HEAD}"

          git init candidate
          git -C candidate remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C candidate fetch --no-tags --depth=1 origin "${SOURCE_WORLD_HEAD}"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "${SOURCE_WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          patch_sha="$(sha256sum export/world-v13-source.patch | awk '{print $1}')"
          test "$patch_sha" = "${EXPECTED_SOURCE_PATCH_SHA256}"
          git -C candidate add -A
          source_candidate_tree="$(git -C candidate write-tree)"
          test "$source_candidate_tree" = "${EXPECTED_SOURCE_CANDIDATE_TREE}"
          printf 'qualified_source_patch_sha256=%s\n' "$patch_sha"
          printf 'qualified_source_candidate_tree=%s\n' "$source_candidate_tree"

      - name: Build exact target overlay without publishing it
        shell: bash
        run: |
          set -euo pipefail

          git init target
          git -C target remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C target fetch --no-tags --depth=1 origin "${TARGET_WORLD_HEAD}"
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "${TARGET_WORLD_HEAD}"

          git -C target apply --check "$GITHUB_WORKSPACE/export/world-v13-source.patch"
          git -C target apply "$GITHUB_WORKSPACE/export/world-v13-source.patch"

          rm -f \
            target/.github/workflows/tmp-world-v13k-candidate-export.yml \
            target/.github/workflows/trnm-world-development-closure-probe.yml \
            target/docs/status/candidate-static-evidence-v8.txt \
            target/docs/status/cross-repository-blob-probe.txt

          git -C target add -A
          git -C target diff --cached --check
          changed_count="$(git -C target diff --cached --name-only | wc -l | tr -d ' ')"
          test "$changed_count" -ge 60
          target_tree="$(git -C target write-tree)"
          printf 'expected_target_tree=%s\n' "$target_tree" | tee export/target-tree.txt
          printf 'changed_paths=%s\n' "$changed_count" | tee -a export/target-tree.txt

      - name: Create unreferenced blobs and tree only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DIR: ${{ github.workspace }}/target
          OUTPUT_DIR: ${{ github.workspace }}/export
          REPOSITORY: TrillionniumFoundation/Trillionnium-World
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_head = os.environ["TARGET_WORLD_HEAD"]
          target_branch = os.environ["TARGET_WORLD_BRANCH"]
          root = Path(os.environ["TARGET_DIR"])
          output = Path(os.environ["OUTPUT_DIR"])

          def api(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trnm-world-bounded-object-import",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: {error.code}: {body}")

          target_commit = api("GET", f"/repos/{repository}/git/commits/{target_head}")
          base_tree = target_commit["tree"]["sha"]

          raw = subprocess.check_output(
              ["git", "-C", str(root), "diff", "--cached", "--name-only", "-z"]
          )
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          if len(paths) < 60:
              raise SystemExit(f"refusing undersized object import: {len(paths)} paths")
          if ".github/workflows/tmp-world-v13k-object-import.yml" in paths:
              raise SystemExit("temporary importer leaked into target tree")

          entries = []
          records = []
          for relative in paths:
              path = root / relative
              if not path.exists():
                  entries.append({"path": relative, "mode": "100644", "type": "blob", "sha": None})
                  records.append({"path": relative, "status": "deleted"})
                  continue
              if not path.is_file():
                  raise SystemExit(f"non-file target path is unsupported: {relative}")
              data = path.read_bytes()
              index_line = subprocess.check_output(
                  ["git", "-C", str(root), "ls-files", "-s", "--", relative],
                  text=True,
              ).strip()
              if not index_line:
                  raise SystemExit(f"missing index mode for {relative}")
              mode = index_line.split(None, 1)[0]
              if mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported mode {mode} for {relative}")
              blob = api(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"},
              )
              entries.append({"path": relative, "mode": mode, "type": "blob", "sha": blob["sha"]})
              records.append({
                  "path": relative,
                  "status": "written",
                  "mode": mode,
                  "bytes": len(data),
                  "git_blob_sha1": blob["sha"],
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          tree = api(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          expected_tree = subprocess.check_output(
              ["git", "-C", str(root), "write-tree"], text=True
          ).strip()
          if tree["sha"] != expected_tree:
              raise SystemExit(
                  f"server/local tree mismatch: server={tree['sha']} local={expected_tree}"
              )

          branch = api("GET", f"/repos/{repository}/branches/{target_branch.replace('/', '%2F')}")
          observed_head = branch["commit"]["sha"]
          if observed_head != target_head:
              raise SystemExit(
                  f"target branch moved during import: expected={target_head} observed={observed_head}"
              )

          manifest = {
              "schema": "trnm_world_unreferenced_tree_import_v1",
              "repository": repository,
              "target_branch": target_branch,
              "target_head_unchanged": observed_head,
              "base_tree": base_tree,
              "unreferenced_tree": tree["sha"],
              "source_patch_sha256": os.environ["EXPECTED_SOURCE_PATCH_SHA256"],
              "source_candidate_tree": os.environ["EXPECTED_SOURCE_CANDIDATE_TREE"],
              "commit_created": False,
              "ref_updated": False,
              "files": records,
          }
          (output / "object-import.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"TRNM_WORLD_UNREFERENCED_TREE={tree['sha']}")
          print(f"TRNM_WORLD_OBJECT_COUNT={len(records)}")
          print("TRNM_WORLD_NO_COMMIT_OR_REF_UPDATE=PASS")
          PY

      - name: Upload immutable import evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-v13k-unreferenced-tree-${{ github.sha }}
          path: export/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
