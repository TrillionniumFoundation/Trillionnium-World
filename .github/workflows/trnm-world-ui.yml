name: trnm-world-ui

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/crates/trnm-first-contact/src/ui/**'
      - 'trillionnium/crates/trnm-first-contact/src/lib.rs'
      - 'docs/README.md'
      - 'docs/development/trnm-world-ui-**'
      - 'scripts/check-trnm-ui-contract.sh'
      - 'scripts/test-trnm-ui-contract-negative.sh'
      - '.github/workflows/trnm-world-ui.yml'
  push:
    branches: [main]
    paths:
      - 'trillionnium/crates/trnm-first-contact/src/ui/**'
      - 'trillionnium/crates/trnm-first-contact/src/lib.rs'
      - 'docs/README.md'
      - 'docs/development/trnm-world-ui-**'
      - 'scripts/check-trnm-ui-contract.sh'
      - 'scripts/test-trnm-ui-contract-negative.sh'
      - '.github/workflows/trnm-world-ui.yml'

permissions:
  contents: read

concurrency:
  group: trnm-world-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify UI architecture and authority labels
        run: bash scripts/check-trnm-ui-contract.sh
      - name: Prove UI contract rejects forbidden fixtures
        run: bash scripts/test-trnm-ui-contract-negative.sh

  ui-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trillionnium
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact stable Rust action revision
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Install native Bevy dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev
          libwayland-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: UI and client library tests
        run: cargo test -p trnm-first-contact --lib --locked
      - name: UI and client Clippy
        run: cargo clippy -p trnm-first-contact --lib --locked -- -D warnings
