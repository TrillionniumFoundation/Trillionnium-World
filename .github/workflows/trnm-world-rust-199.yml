name: World Rust 1.99 qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: world-rust-199-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_TEST_THREADS: "1"
  PRODUCTION_AUTHORIZATION: not_granted
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  MERGE_SHA: ${{ github.sha }}

jobs:
  qualification:
    name: ${{ matrix.context }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: contracts
            context: trnm-world-rust-199/contracts
            manifest: contracts/Cargo.toml
          - lane: game
            context: trnm-world-rust-199/game
            manifest: trillionnium/Cargo.toml
          - lane: legacy-platform
            context: trnm-world-rust-199/legacy-platform
            manifest: trillionnium/crates/platform/Cargo.toml
          - lane: world-authority
            context: trnm-world-rust-199/world-authority
            manifest: trillionnium/crates/world-authority/Cargo.toml
          - lane: transition
            context: trnm-world-rust-199/transition
            manifest: trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
          - lane: settlement-outbox
            context: trnm-world-rust-199/settlement-outbox
            manifest: trillionnium/tools/trnm-settlement-outbox-contract/Cargo.toml
          - lane: portable-transition
            context: trnm-world-rust-199/portable-transition
            manifest: trillionnium/contracts/trnm-world-transition-v1/Cargo.toml
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HEAD_SHA }}
          path: world-head
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout actual GitHub prospective merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MERGE_SHA }}
          path: world-merge
          fetch-depth: 2
          persist-credentials: false
      - name: Install compiler and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustc --version --verbose | tee evidence/rustc-version.txt
          cargo --version --verbose | tee evidence/cargo-version.txt
          grep -Fx 'release: 1.99.0' evidence/rustc-version.txt
          grep -Fx 'commit-hash: b940084d7eb6a299eb4bfeb8e34901bc051e7ac4' evidence/rustc-version.txt
      - name: Validate exact objects without promoting historical evidence
        env:
          LANE: ${{ matrix.lane }}
          MANIFEST: ${{ matrix.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          labels=(head merge)
          for label in "${labels[@]}"; do
            source="$GITHUB_WORKSPACE/world-$label"
            expected="$HEAD_SHA"
            test "$label" != merge || expected="$MERGE_SHA"
            test "$(git -C "$source" rev-parse HEAD)" = "$expected"
            if test "$label" = merge; then
              test "$(git -C "$source" rev-parse HEAD^1)" = "$BASE_SHA"
              test "$(git -C "$source" rev-parse HEAD^2)" = "$HEAD_SHA"
            fi
            {
              printf 'lane=%s\nobject=%s\n' "$LANE" "$label"
              printf 'commit=%s\ntree=%s\n' "$expected" "$(git -C "$source" rev-parse 'HEAD^{tree}')"
              printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'production_authorization=not_granted\n'
            } > "evidence/$label-identity.txt"
            (
              set -euo pipefail
              cd "$source"
              export CARGO_TARGET_DIR="$RUNNER_TEMP/world-rust-199-$LANE-$label"
              python3 -B scripts/check-trnm-world-ci-target.py --root "$source" --role "$label" \
                > "$GITHUB_WORKSPACE/evidence/$label-admission-before.json"
              # Recheck raw source/index/event binding even when compilation fails.
              verify_after() {
                status=$?
                trap - EXIT
                python3 -B scripts/check-trnm-world-ci-target.py --root "$source" --role "$label" \
                  > "$GITHUB_WORKSPACE/evidence/$label-admission-after.json" || status=1
                {
                  df -Pk "$RUNNER_TEMP"
                  if test -d "$CARGO_TARGET_DIR"; then du -sk "$CARGO_TARGET_DIR"; fi
                } > "$GITHUB_WORKSPACE/evidence/$label-disk-after.txt"
                exit "$status"
              }
              trap verify_after EXIT
              df -Pk "$RUNNER_TEMP" > "$GITHUB_WORKSPACE/evidence/$label-disk-before.txt"
              cargo metadata --manifest-path "$MANIFEST" --locked --no-deps --format-version 1
              if test "$LANE" = portable-transition; then
                # Compile the portable deterministic contract, not the native client.
                for target in wasm32-unknown-unknown aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
                  rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$target"
                  cargo build --manifest-path "$MANIFEST" --lib --locked --target "$target"
                done
              else
                # Legacy platform is compatibility coverage only; it stays excluded.
                cargo fmt --manifest-path "$MANIFEST" --all -- --check
                cargo test --manifest-path "$MANIFEST" --workspace --all-targets --locked
                cargo clippy --manifest-path "$MANIFEST" --workspace --all-targets --locked -- -D warnings
                cargo build --manifest-path "$MANIFEST" --workspace --all-targets --locked
              fi
              git diff --exit-code
              git diff --cached --exit-code
            ) 2>&1 | tee "evidence/$label-validation.log"
          done
      - name: Upload compiler and exact-object validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-rust-199-${{ matrix.lane }}-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
  required:
    name: trnm-world-rust-199/required
    if: always()
    needs: [qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every compiler qualification lane
        env:
          RESULT: ${{ needs.qualification.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$RESULT" = success
