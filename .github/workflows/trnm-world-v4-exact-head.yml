name: trnm-world-v4-exact-head

on:
  push:
    branches:
      - fix/world-plan-v4-convergence-2026-08-30
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-world-v4-exact-head-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  source:
    name: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.10@sha256:1d288494853e244e7a78d87b3526e650e5221c622f9768ecac9313d0874a9c39
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trnm_world_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trnm_world_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trnm_world_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trnm_world_ci
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'head=%s\ntree=%s\n' "${GITHUB_SHA}" "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Reject hidden source and legacy settlement
        shell: bash
        run: |
          set -euo pipefail
          crate=trillionnium/crates/trnm-game-server
          test ! -e "${crate}/build.rs"
          test ! -e "${crate}/src/lib.rs.in"
          ! grep -q '^build = "build.rs"$' "${crate}/Cargo.toml"
          ! grep -q 'trnm_game_server_lib_generated.rs' "${crate}/src/lib.rs"
          ! grep -q 'reconcile_economy(&state.cex' "${crate}/src/lib.rs"
          ! grep -q 'settle_pending_matches(&settlement_state' "${crate}/src/lib.rs"
          grep -q 'terminal settlement is owned by trnm-settlement-worker' "${crate}/src/lib.rs"
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh

      - name: Validate machine truth and protocol contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/development/trnm-world-gap-closure-ledger-v4.json >/dev/null
          python3 -m json.tool docs/status/world-v4-convergence-state-2026-08-30.json >/dev/null
          bash scripts/check-trnm-world-transition-contract.sh
          bash scripts/test-trnm-world-transition-contract-negative.sh
          python3 scripts/check-trnm-world-v4-convergence.py

      - name: Validate directly compiled workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --locked --workspace --all-targets
          cargo test --manifest-path trillionnium/Cargo.toml --locked --workspace --all-targets
          cargo clippy --manifest-path trillionnium/Cargo.toml --locked --workspace --all-targets -- -D warnings

      - name: PostgreSQL settlement integration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml --locked -p trnm-game-server --test settlement_postgres -- --nocapture

      - name: Prove read-only validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
