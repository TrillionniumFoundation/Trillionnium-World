name: trnm-world-actions-probe

on:
  push:
    branches:
      - ci/world-v4-validation-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: trnm-world-actions-probe/probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record immutable identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
